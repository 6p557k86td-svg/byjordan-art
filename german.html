function speak(text){const status=document.querySelector('#audio-status');if(!('speechSynthesis' in window)){if(status)status.textContent='Your browser does not support speech. Read the German text aloud instead.';return}const voices=speechSynthesis.getVoices(),voice=voices.find(v=>v.lang.startsWith('de'));speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang='de-DE';utterance.rate=.8;if(voice)utterance.voice=voice;utterance.onerror=()=>{if(status)status.textContent='Audio could not play. Check whether your device has a German voice installed.'};speechSynthesis.speak(utterance);if(status)status.textContent='Device-generated German audio. Voice quality depends on your browser.'}
function intro(){return `<section class="intro"><div><p class="eyebrow">YOUR FIRST CHAPTER IN GERMAN</p><h1>Small steps.<br>A whole new language.</h1><p>Start with “Hallo.” Build the words and confidence for everyday life, one lesson at a time.</p></div><div class="stamp"><div class="row"><span class="eyebrow">THE BEGINNER COURSE</span><strong>A1</strong></div><div class="row"><span>${units.length} guided units</span><span>Learn at your pace</span></div></div></section>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='exam')return examView();if(view==='grammar')return grammarView();if(view==='worksheets')return worksheetView();if(view==='words')return wordView();if(view==='review')return reviewView();const u=units[current];app.innerHTML=intro()+`<div class="workspace"><aside class="syllabus" aria-label="Course units"><h3>YOUR LEARNING PATH</h3>${units.map((u,i)=>`<button class="unit ${i===current?'selected':''}" data-unit="${i}" aria-current="${i===current?'step':'false'}"><b>${String(i+1).padStart(2,'0')}</b><span>${esc(u.title)}</span>${completed.has(i)?'<small aria-label="completed">✓</small>':''}</button>`).join('')}<div class="progress"><span style="width:${completed.size/units.length*100}%"></span></div><p class="notice">${completed.size} of ${units.length} units complete<br>Progress saved on this device.</p></aside><article class="lesson"><div class="lesson-top"><div><p class="eyebrow">UNIT ${String(current+1).padStart(2,'0')} / ${units.length}</p><h2>${u.title}</h2><p class="subtle">${u.goal}</p></div><span class="pill">A1 · Beginner</span></div><div class="tabs" aria-label="Lesson sections">${['learn','words','listen','practice'].map(t=>`<button data-section="${t}" class="${section===t?'selected':''}" aria-pressed="${section===t}">${{learn:'Grammar & examples',words:'Vocabulary',listen:'Listen & speak',practice:'Practice'}[t]}</button>`).join('')}</div><div id="lesson-body">${lessonBody(u)}</div><div class="row bottom"><span class="subtle">${completed.has(current)?'✓ Marked complete':'Take your time. Say it out loud.'}</span><button class="primary" data-next-section>${section==='practice'?'Complete unit':{learn:'Explore vocabulary',words:'Listen & speak',listen:'Try the practice'}[section]}</button></div><p class="notice" id="audio-status" role="status">Audio uses your device’s German text-to-speech voice.</p></article></div>`}
function lessonBody(u){if(section==='learn')return `<h3>Grammar: the core idea</h3><p>${u.grammar}</p><div class="example"><div class="row"><strong lang="de">${u.example[0]}</strong>${audio(u.example[0])}</div><p class="subtle">${u.example[1]}</p></div><h3>Go deeper</h3><p>Learn the rules step by step, compare forms, and check your understanding.</p><div class="grammar-links">${grammarTopics.map((g,i)=>({g,i})).filter(({g})=>g.units.includes(current)).map(({g,i})=>`<button class="secondary" data-grammar="${i}">${g.title}</button>`).join('')}</div><h3 style="margin-top:24px">Make it yours</h3><p>${u.speak}</p>`;if(section==='words')return `<p class="subtle">Learn nouns together with their article and plural. Tap the note to listen.</p><div class="grid">${u.words.map(w=>`<div class="word"><div><strong lang="de">${w[0]}</strong><small>${w[1]}</small></div>${audio(w[0].split(' · ')[0])}</div>`).join('')}</div>`;if(section==='listen')return `<h3>A conversation you can use</h3><button class="secondary" data-audio="${esc(u.dialogue.map(d=>d[0]).join(' '))}">Listen to the conversation</button>${u.dialogue.map((d,i)=>`<div class="dialogue"><div class="row"><p lang="de"><b>${i%2?'B':'A'}</b> &nbsp;${d[0]}</p>${audio(d[0])}</div><details><summary>Show translation</summary><p>${d[1]}</p></details></div>`).join('')}<h3 style="margin-top:24px">Your turn</h3><p>${u.speak}</p><p class="subtle">Repeat each line, then try without looking. Compare your sounds with the audio.</p>`;return `<h3>Put it into practice</h3>${u.quiz.map((q,i)=>question(q,i)).join('')}<h3>Write a little German</h3><label for="writing">${u.write}</label><textarea id="writing" placeholder="Schreib hier …" lang="de"></textarea><details><summary>Compare with a sample answer</summary><p lang="de">${u.sample}</p><p class="notice">Your wording may differ. Check word order, verb endings, and capital letters on nouns. Writing is for self-review, not automatically graded.</p></details>`}
function question(q,i){let a=answers[`${view}-${current}-${i}`];return `<div class="question"><p><b>${i+1}.</b> ${q[0]}</p><div class="options">${q[1].map((o,j)=>`<button class="option ${a===undefined?'':j===q[2]?'correct':a===j?'incorrect':''}" data-q="${i}" data-answer="${j}" ${a!==undefined?'disabled':''}>${o}</button>`).join('')}</div><div class="feedback" role="status">${a===undefined?'':`${a===q[2]?'Correct.':'Not quite.'} ${q[3]}`}</div></div>`}
function deck(){return (category<0?units: [units[category]]).flatMap(u=>u.words)}
function wordView(){let words=deck();card=Math.min(card,words.length-1);app.innerHTML=`<p class="eyebrow">WORD STUDIO</p><h1>A few words.<br>Every day.</h1><p class="subtle">Recall the meaning before you turn the card over.</p><div class="toolbar"><label for="category">Practice set</label><select id="category"><option value="-1">All ${wordsCount()} entries</option>${units.map((u,i)=>`<option value="${i}" ${category===i?'selected':''}>${i+1}. ${u.title}</option>`).join('')}</select><span>${card+1} / ${words.length}</span></div><button class="flashcard" data-flip aria-label="Flip flashcard"><span class="eyebrow">${flipped?'ENGLISH':'DEUTSCH'}</span><strong lang="${flipped?'en':'de'}">${esc(words[card][flipped?1:0])}</strong><small>Click or press Enter to flip</small></button><div class="row bottom"><button class="secondary" data-card="-1">Previous card</button>${audio(words[card][0].split(' · ')[0])}<button class="primary" data-card="1">Next card</button></div><p class="notice" id="audio-status" role="status">German audio uses your device’s text-to-speech voice.</p>`}
function wordsCount(){return units.reduce((n,u)=>n+u.words.length,0)}
const reviewQuestions=[['Read: “Der Zug fährt um 14:30 Uhr.” When does it leave?',['At 2:30 p.m.','At 4:30 p.m.','At 2:13 p.m.'],0,'14:30 is 2:30 p.m.'],['Read: “Am Sonntag geschlossen.” What does the sign mean?',['Open Sunday','Closed Sunday','Open only on Sunday'],1,'Geschlossen means closed.'],['Choose the correct question.',['Wo du wohnst?','Wo wohnst du?','Wo wohnen du?'],1,'Question word + conjugated verb + subject.'],['Ich sehe ___ Mann.',['der','dem','den'],2,'A masculine direct object uses den.'],['Wir ___ gestern in Berlin.',['war','waren','wart'],1,'The past of sein with wir is waren.'],['Ich kann heute nicht kommen, denn …',['ich bin krank.','bin ich krank.','ich krank bin.'],0,'Denn preserves main-clause word order.'],['Ich habe gestern Brot ___.',['kaufe','gekauft','kaufen'],1,'Perfekt: habe + gekauft.'],['Listen to the announcement above. Where is the meeting?',['At the station','At the café','At school'],1,'Im Café means at the café.']];
function reviewView(){let answered=reviewQuestions.filter((_,i)=>answers[`review-${current}-${i}`]!==undefined).length,score=reviewQuestions.filter((q,i)=>answers[`review-${current}-${i}`]===q[2]).length;app.innerHTML=`<p class="eyebrow">BRING IT ALL TOGETHER</p><h1>Your A1 checkpoint.</h1><p class="subtle">Practice reading, listening, writing, and speaking. This is an independent review, not an official exam or a proficiency certificate.</p><div class="grid"><section class="review-card"><h2>Read & listen</h2><button class="secondary" data-audio="Wir treffen uns am Freitag um drei Uhr im Café.">Play listening announcement</button><details><summary>Show listening transcript</summary><p lang="de">Wir treffen uns am Freitag um drei Uhr im Café.</p></details>${reviewQuestions.map((q,i)=>question(q,i)).join('')}<div role="status"><b>${answered===reviewQuestions.length?`Your result: ${score} / ${reviewQuestions.length}`:`${answered} / ${reviewQuestions.length} answered`}</b></div><button class="secondary" data-retry style="margin-top:18px">Try again</button><p class="notice" id="audio-status" role="status"></p></section><section><div class="review-card"><h2>Write</h2><label for="review-writing">Invite a friend to your birthday. Say when and where, and ask them to bring something. Aim for 30–40 words.</label><textarea id="review-writing" lang="de" placeholder="Hallo …"></textarea><details><summary>Sample response & checklist</summary><p lang="de">Hallo Mia, am Samstag habe ich Geburtstag. Ich mache um sechs Uhr eine Party bei mir zu Hause. Kannst du kommen? Bring bitte einen Kuchen mit. Ich freue mich auf dich! Viele Grüße, Alex</p><p>Did you include a greeting, a day/time, a place, a request, and a closing? Check verbs and noun capitalization.</p></details></div><div class="review-card" style="margin-top:20px"><h2>Speak</h2><p>Introduce yourself for about one minute: name, country, city, languages, work or study, and hobbies.</p><p>Then ask a partner for their phone number, offer them a drink, and arrange a meeting.</p><details><summary>Helpful sentence starters</summary><p lang="de">Ich heiße … / Ich komme aus … / Ich wohne in … / Ich spreche … / Ich arbeite als … / Ich … gern. / Wie ist deine Telefonnummer? / Möchtest du einen Tee? / Wann hast du Zeit?</p></details></div><div class="review-card" style="margin-top:20px"><h2>Ready for everyday life?</h2><p>Use these as self-checks after the course.</p>${['I can introduce myself and ask personal questions.','I can understand slow, simple speech on familiar topics.','I can order food, shop, and ask for directions.','I can read simple signs and short messages.','I can complete personal details on a form.','I can write a short invitation or practical message.'].map(t=>`<label><input type="checkbox"> ${t}</label>`).join('')}</div></section></div>`}
function openUnit(index){if(!Number.isInteger(index)||index<0||index>=units.length)throw new Error('Unit must be an integer from 1 to 17.');current=index;view='course';section='learn';render()}
document.addEventListener('click',e=>{let b=e.target.closest('button,a.brand');if(!b)return;if(b.matches('a.brand')){e.preventDefault();view='course';render()}if(b.dataset.view){view=b.dataset.view;render()}if(b.dataset.unit!==undefined)openUnit(Number(b.dataset.unit));if(b.dataset.section){section=b.dataset.section;render()}if(b.dataset.audio)speak(b.dataset.audio);if(b.hasAttribute('data-flip')){flipped=!flipped;wordView()}if(b.dataset.card){card=(card+Number(b.dataset.card)+deck().length)%deck().length;flipped=false;wordView()}if(b.hasAttribute('data-next-section')){if(section==='practice'){completed.add(current);try{localStorage.setItem('anfang-completed',JSON.stringify([...completed]))}catch{}if(current<units.length-1){current++;section='learn'}else view='review'}else section=['learn','words','listen','practice'][['learn','words','listen','practice'].indexOf(section)+1];render()}if(b.dataset.q!==undefined){const i=Number(b.dataset.q),a=Number(b.dataset.answer),q=view==='review'?reviewQuestions[i]:units[current].quiz[i];answers[`${view}-${current}-${i}`]=a;const el=b.closest('.question');el.querySelectorAll('.option').forEach((o,j)=>{o.disabled=true;o.classList.toggle('correct',j===q[2]);o.classList.toggle('incorrect',j===a&&a!==q[2])});el.querySelector('.feedback').textContent=(a===q[2]?'Correct. ':'Not quite. ')+q[3];if(view==='review'){let answered=reviewQuestions.filter((_,n)=>answers[`review-${current}-${n}`]!==undefined).length,score=reviewQuestions.filter((q,n)=>answers[`review-${current}-${n}`]===q[2]).length;document.querySelector('.review-card > div[role="status"]').textContent=answered===reviewQuestions.length?`Your result: ${score} / ${reviewQuestions.length}`:`${answered} / ${reviewQuestions.length} answered`}}if(b.hasAttribute('data-retry')){Object.keys(answers).filter(k=>k.startsWith('review-')).forEach(k=>delete answers[k]);reviewView()}});
document.addEventListener('change',e=>{if(e.target.id==='category'){category=Number(e.target.value);card=0;flipped=false;wordView()}});
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'open_german_unit',description:'Open an A1 German unit, numbered 1 to 17. Does not mark it complete.',inputSchema:{type:'object',properties:{unit:{type:'integer',minimum:1,maximum:17}},required:['unit'],additionalProperties:false},annotations:{readOnlyHint:false},execute:input=>{openUnit(input.unit-1);return{unit:current+1,title:units[current].title}}})).catch(()=>{})}catch{}}

function worksheetView(){const sets=[['Hallo, that’s me','Units 01–03 · Introductions, spelling & personal details'],['People & everyday life','Units 04–06 · Articles, family & present tense'],['Time, cafés & shopping','Units 07–09 · Plans, ordering & prices'],['Home, town & free time','Units 10–12 · Locations, transport & hobbies'],['Work, health & travel','Units 13–15 · Rules, appointments & reservations'],['Yesterday & little messages','Units 16–17 · Past tense & practical writing']];app.innerHTML=`<p class="eyebrow">OFFLINE, WITH A PEN</p><h1>Make room<br>for practice.</h1><p class="subtle">Six printable worksheets to go with your course. Each has sentence practice, a short reading, and a writing task.</p><div class="toolbar"><a class="primary" style="text-decoration:none" href="anfang-a1-workbook.pdf" download>Download the A1 workbook</a><span class="subtle">8 pages · PDF · A4</span></div><div class="grid">${sets.map((set,i)=>`<article class="review-card"><p class="eyebrow">WORKSHEET 0${i+1}</p><h2>${set[0]}</h2><p class="subtle">${set[1]}</p><a class="secondary" style="display:inline-block;text-decoration:none" href="anfang-a1-workbook.pdf#page=${i+1}" target="_blank" rel="noopener">Open worksheet ${i+1}</a></article>`).join('')}</div><div class="example"><h3>Check your work</h3><p>The answer key and example writing responses are on pages 7–8. Print pages 1–6 for practice, or print one worksheet at a time.</p><a href="anfang-a1-workbook.pdf#page=7" target="_blank" rel="noopener" style="color:inherit">Open the answer key</a></div>`}

function grammarView(){const g=grammarTopics[grammarIndex];app.innerHTML=`<div class="grammar-heading"><p class="eyebrow">A1 GRAMMAR REFERENCE</p><h1>Understand the pattern.</h1><p class="subtle">Choose a topic. Read the explanation, compare examples, then test yourself.</p></div><div class="workspace"><aside class="syllabus" aria-label="Grammar topics"><h3>GRAMMAR TOPICS</h3>${grammarTopics.map((g,i)=>`<button class="unit ${i===grammarIndex?'selected':''}" data-grammar="${i}" aria-current="${i===grammarIndex?'page':'false'}"><b>${String(i+1).padStart(2,'0')}</b><span>${g.title}</span></button>`).join('')}</aside><article class="lesson"><p class="eyebrow">${g.tag}</p><h2>${g.title}</h2><p>${g.intro}</p>${g.steps.map((step,i)=>`<section class="grammar-step"><h3>${i+1}. ${step[0]}</h3><p>${step[1]}</p></section>`).join('')}<h3>Keep this pattern handy</h3><div class="table-scroll" tabindex="0" role="region" aria-label="${g.title} reference table"><table><thead><tr>${g.headers.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${g.rows.map(row=>`<tr>${row.map((cell,i)=>i===0?`<th scope="row">${cell}</th>`:`<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div><h3 style="margin-top:28px">Examples, unpacked</h3>${g.examples.map(ex=>`<div class="example"><div class="row"><strong lang="de">${ex[0]}</strong>${audio(ex[0])}</div><p>${ex[1]}</p><p class="subtle">${ex[2]}</p></div>`).join('')}<div class="mistake"><h3>A common mistake</h3><p><span class="subtle">Instead of:</span> <s lang="de">${g.mistake[0]}</s></p><p><b>Use:</b> <span lang="de">${g.mistake[1]}</span></p><p>${g.mistake[2]}</p></div><h3 style="margin-top:28px">Check your understanding</h3>${g.quiz.map((q,i)=>{const a=grammarAnswers[grammarIndex+'-'+i];return `<div class="question"><p><b>${i+1}.</b> ${q[0]}</p><div class="options">${q[1].map((o,j)=>`<button class="option ${a===undefined?'':j===q[2]?'correct':a===j?'incorrect':''}" data-gq="${i}" data-ga="${j}" ${a!==undefined?'disabled':''}>${o}</button>`).join('')}</div><div class="feedback" role="status">${a===undefined?'':(a===q[2]?'Correct. ':'Not quite. ')+q[3]}</div></div>`}).join('')}<button class="secondary" data-grammar-retry>Reset these questions</button><div class="bottom"><h3>Practice this in a lesson</h3><div class="grammar-links">${g.units.map(i=>`<button class="secondary" data-unit="${i}">${String(i+1).padStart(2,'0')} · ${units[i].title}</button>`).join('')}</div></div><div class="row bottom"><button class="secondary" data-grammar="${Math.max(0,grammarIndex-1)}" ${grammarIndex===0?'disabled':''}>Previous topic</button><span>${grammarIndex+1} / ${grammarTopics.length}</span><button class="primary" data-grammar="${Math.min(grammarTopics.length-1,grammarIndex+1)}" ${grammarIndex===grammarTopics.length-1?'disabled':''}>Next topic</button></div><p class="notice" id="audio-status" role="status">German audio uses your device’s text-to-speech voice.</p></article></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.grammar!==undefined){grammarIndex=Number(b.dataset.grammar);view='grammar';render();document.querySelector('.lesson').scrollIntoView({block:'start',behavior:'smooth'})}if(b.dataset.gq!==undefined){const i=Number(b.dataset.gq),a=Number(b.dataset.ga),q=grammarTopics[grammarIndex].quiz[i];grammarAnswers[grammarIndex+'-'+i]=a;const el=b.closest('.question');el.querySelectorAll('.option').forEach((o,j)=>{o.disabled=true;o.classList.toggle('correct',j===q[2]);o.classList.toggle('incorrect',j===a&&a!==q[2])});el.querySelector('.feedback').textContent=(a===q[2]?'Correct. ':'Not quite. ')+q[3]}if(b.hasAttribute('data-grammar-retry')){Object.keys(grammarAnswers).filter(k=>k.startsWith(grammarIndex+'-')).forEach(k=>delete grammarAnswers[k]);grammarView()}});

let examSection='plan', examChoices={listening:{},reading:{}}, examSubmitted={listening:false,reading:false}, writingIndex=0, writingDrafts={}, speakingIndex=0, examDeadline=0, examClock=null;
function examView(){const labels={plan:'Study plan',listening:'Listening',reading:'Reading',writing:'Writing',speaking:'Speaking',official:'Official mock tests'};app.innerHTML=`<div class="grammar-heading"><p class="eyebrow">PREPARE ALL FOUR SKILLS</p><h1>A1 exam preparation.</h1><p class="subtle">Build your skills here, then check them with your provider’s official mock tests.</p></div><div class="tabs" aria-label="Exam preparation sections">${Object.entries(labels).map(([k,v])=>`<button data-exam-section="${k}" class="${examSection===k?'selected':''}">${v}</button>`).join('')}</div><div id="exam-body">${examContent()}</div>`;updateExamClock()}
function examContent(){if(examSection==='plan')return `<div class="grid"><article class="review-card"><h2>Your study routine</h2><p>Use this as your study hub. Work through lessons in order, review grammar, and practice all four skills each week. Repeat a stage when it still feels difficult; these stages are not a promise of readiness in a fixed number of days.</p><ol><li><b>Foundations:</b> units 1–6. Introduce yourself, learn noun articles, and make questions. Practice numbers, spelling, and short personal forms.</li><li><b>Everyday tasks:</b> units 7–12. Make plans, order food, shop, and ask directions. Listen for times, prices, places, and corrected information.</li><li><b>Practical communication:</b> units 13–17. Write messages, make requests, and talk about past activities.</li><li><b>Exam rehearsal:</b> use fresh official mock tests under their stated conditions. Review mistakes and have someone assess your writing and speaking.</li></ol><h3>A 45-minute practice session</h3><p>10 minutes vocabulary recall · 10 minutes grammar or a lesson · 10 minutes listening/reading · 15 minutes writing or speaking. This is a suggested session, not a complete estimate of the time needed to reach A1.</p></article><article class="review-card"><h2>Know what your scores mean</h2><p>The listening and reading drills here check selected answers. They are original practice exercises, not full official exams, and their scores do not predict a pass.</p><p>Writing and speaking need a human judgment of whether you communicate clearly and complete the task. Use the sample answers and checklists, then get feedback from a German teacher or a capable conversation partner.</p><p>Device-generated listening is useful for repetition. Also practice with the official recordings so you hear different real speakers at test speed.</p><h3>Expand your vocabulary</h3><p>The flashcards here are a starter set, not a complete exam vocabulary list. Work through the <a href="https://www.goethe.de/pro/relaunch/prf/sr/A1_SD1_Wortliste_02.pdf" target="_blank" rel="noopener">official Goethe A1 vocabulary list</a> alongside them. For each unfamiliar word, write your own short sentence and practice recalling its meaning.</p><h3>Before you book or sit the test</h3><ul><li>Confirm your exact exam provider and certificate name.</li><li>Complete more than one unfamiliar official mock test without translations or notes.</li><li>Include timed writing and interactive speaking, not just grammar scores.</li><li>Review the provider’s current rules and scoring guide.</li></ul><button class="primary" data-exam-section="official">Find official mock tests</button></article></div>`;
if(examSection==='reading'||examSection==='listening'){const type=examSection,qs=type==='reading'?examReading:examListening,done=examSubmitted[type],score=qs.filter((q,i)=>examChoices[type][i]===q[3]).length;return `<article class="lesson"><div class="row"><div><h2>${type==='reading'?'Read for meaning':'Listen for the detail'}</h2><p>${qs.length} original practice questions · ${type==='reading'?'Messages, signs, and everyday notices':'Messages, announcements, and short conversations'}</p></div><button class="secondary" data-timer="${type==='reading'?15:20}">Start ${type==='reading'?15:20}-minute practice timer</button></div><p id="exam-clock" role="timer"></p><p class="notice">${type==='listening'?'Listen before opening transcripts. Use one or two plays for a challenge; this drill does not enforce official playback rules. Audio is device-generated.':'Read the question carefully, then look for evidence in the text. No dictionary for your first attempt.'} The timer is optional and does not submit answers automatically.</p>${qs.map((q,i)=>`<section class="question exam-question"><h3>Question ${i+1}</h3>${type==='reading'?`<div class="example" lang="de">${esc(q[0])}</div>`:`<button class="secondary" data-audio="${esc(q[0])}">Play listening ${i+1}</button><details><summary>Show transcript (study mode)</summary><p lang="de">${esc(q[0])}</p></details>`}<p lang="de"><b>${q[1]}</b></p><fieldset style="border:0;padding:0;margin:0"><legend class="sr-only">${q[1]}</legend>${q[2].map((o,j)=>`<label class="option ${done&&j===q[3]?'correct':done&&examChoices[type][i]===j?'incorrect':''}"><input type="radio" name="exam-${type}-${i}" data-exam-q="${i}" value="${j}" ${examChoices[type][i]===j?'checked':''} ${done?'disabled':''}> ${o}</label>`).join('')}</fieldset>${done?`<p class="feedback">${examChoices[type][i]===q[3]?'Correct.':'Review this one.'} ${q[4]}</p>`:''}</section>`).join('')}<div class="bottom" id="exam-result" role="status">${done?`<h3>${score} / ${qs.length} correct</h3><p>Review the explanations above. Try an unfamiliar official test to check transfer; repeating the same questions can measure memory rather than progress.</p><button class="secondary" data-exam-reset>Start this drill again</button>`:'<button class="primary" data-exam-submit>Check all answers</button><p id="exam-error"></p>'}</div><p class="notice" id="audio-status" role="status"></p></article>`}
if(examSection==='writing'){let w=writingTasks[writingIndex];return `<div class="grid"><article class="lesson"><h2>Short messages</h2><label for="writing-task">Choose a writing task</label><select id="writing-task">${writingTasks.map((w,i)=>`<option value="${i}" ${i===writingIndex?'selected':''}>${i+1}. ${w[0]}</option>`).join('')}</select><h3 style="margin-top:24px">${w[0]}</h3><p>Write around 30–40 German words for this practice task. Include all three points:</p><ol>${w[1].map(t=>`<li>${t}</li>`).join('')}</ol><button class="secondary" data-timer="20">Start 20-minute practice timer</button><p id="exam-clock" role="timer"></p><label for="exam-writing">Your response</label><textarea id="exam-writing" lang="de" placeholder="Write your response in German …">${esc(writingDrafts[writingIndex]||'')}</textarea><p id="word-count" class="notice">${countWords(writingDrafts[writingIndex]||'')} words · Draft kept while this page is open.</p><details><summary>Compare with a sample response</summary><p lang="de">${w[2]}</p><p class="notice">This is one possible response, not the only correct answer.</p></details></article><article class="review-card"><h2>Self-check before feedback</h2>${['I addressed all three content points.','My greeting and closing fit the recipient.','I used understandable, complete sentences.','I checked verb forms and word order.','I capitalized nouns and checked spelling.'].map(t=>`<label><input type="checkbox"> ${t}</label>`).join('')}<p class="notice">A word count or ticked checklist is not a grade. Ask a teacher to check task completion, clarity, and language.</p><h3 style="margin-top:24px">Form practice</h3><p lang="de">Elena Rossi kommt aus Italien. Sie wohnt in Bonn, Gartenstraße 8, Postleitzahl 53111. Sie ist am 12. März 1998 geboren.</p>${['Vorname','Nachname','Land','Wohnort','Postleitzahl'].map((x,i)=>`<label for="form-practice-${i}">${x}</label><input id="form-practice-${i}" autocomplete="off">`).join('')}<details><summary>Check form answers</summary><p>Vorname: Elena<br>Nachname: Rossi<br>Land: Italien<br>Wohnort: Bonn<br>Postleitzahl: 53111</p></details></article></div>`}
if(examSection==='speaking'){let s=speakingCards[speakingIndex];return `<div class="grid"><article class="lesson"><p class="eyebrow">SPEAKING CARD ${speakingIndex+1} / ${speakingCards.length}</p><h2>${s[0]}</h2><div class="example"><p>${s[1]}</p></div><p>Speak aloud before revealing the example. With a partner, take turns asking and responding. Change the details so you are communicating, not reciting.</p><details><summary>Show an example response</summary><p lang="de">${s[2]}</p>${audio(s[2])}</details><div class="row bottom"><button class="secondary" data-speaking="-1">Previous card</button><button class="primary" data-speaking="1">Next card</button></div><p class="notice" id="audio-status" role="status"></p></article><article class="review-card"><h2>Ask your partner to check</h2><ul><li>Did I answer the question or make the requested request?</li><li>Could you understand me without reading my script?</li><li>Could I respond when you changed a detail?</li><li>Did I use polite wording where appropriate?</li><li>Can I ask you to repeat something when I do not understand?</li></ul><p>Record yourself using your phone if useful, then compare with the example. This site does not record you or automatically assess pronunciation.</p><button class="secondary" data-exam-section="official">Watch an official speaking example</button></article></div>`}
return `<div class="grid"><article class="review-card"><h2>Goethe A1: Start Deutsch 1</h2><p>The adult exam covers listening, reading, writing, and speaking. The provider lists approximately 20 minutes for listening, 25 for reading, 20 for writing, and 15 for speaking.</p><p>Use the official practice page for full sample papers, recordings, and a speaking example. Complete a fresh paper without looking at answers, then use its scoring guidance.</p><p><a href="https://www.goethe.de/ins/de/en/m/prf/prf/gzsd1/ueb.html" target="_blank" rel="noopener">Official Goethe practice papers, audio & speaking video</a></p><p><a href="https://bfu.goethe.de/a1_sd1/" target="_blank" rel="noopener">Official interactive model test</a></p><p><a href="https://www.goethe.de/ins/us/en/spr/prf/gzsd1.cfm" target="_blank" rel="noopener">Official Goethe exam format and requirements</a></p></article><article class="review-card"><h2>Start Deutsch 1 / telc Deutsch A1</h2><p>The provider lists listening at approximately 20 minutes, reading and writing together at 45 minutes, and speaking at approximately 15 minutes.</p><p>Use the official mock test and its accompanying audio and assessment guidance. Confirm that this is your exact telc exam; similarly named examinations can have different formats.</p><p><a href="https://www.telc.net/en/language-examinations/certificate-exams/german/start-german1-telc-german-a1/" target="_blank" rel="noopener">Official telc format, free mock test & audio</a></p></article></div><div class="example"><h3>Make the official mock test your checkpoint</h3><ol><li>Read the instructions and set up the correct paper and recording.</li><li>Follow its timing and playback rules, with no dictionary or notes.</li><li>Mark listening and reading using the official key.</li><li>Have writing and speaking reviewed against the provider’s criteria.</li><li>Write down the mistakes you made and return to the matching lessons.</li></ol><p>These external resources are provided by the exam organizations. Anfang is an independent study tool and is not endorsed by either provider. Format references checked October 2026.</p></div>`}
function countWords(s){return s.trim()?s.trim().split(/\s+/).length:0}
function updateExamClock(){const el=document.querySelector('#exam-clock');if(!el||!examDeadline)return;const seconds=Math.max(0,Math.ceil((examDeadline-Date.now())/1000));el.textContent=seconds?`Practice time remaining: ${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`:'Time is up. Finish your current thought, then check your work.';if(!seconds){clearInterval(examClock);examClock=null}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.examSection){examSection=b.dataset.examSection;examView()}if(b.dataset.timer){examDeadline=Date.now()+Number(b.dataset.timer)*60000;clearInterval(examClock);examClock=setInterval(updateExamClock,1000);updateExamClock()}if(b.hasAttribute('data-exam-submit')){const qs=examSection==='reading'?examReading:examListening;if(Object.keys(examChoices[examSection]).length<qs.length){document.querySelector('#exam-error').textContent='Answer all 12 questions before checking your work.';return}examSubmitted[examSection]=true;examView();document.querySelector('#exam-result').scrollIntoView({behavior:'smooth'})}if(b.hasAttribute('data-exam-reset')){examChoices[examSection]={};examSubmitted[examSection]=false;examView()}if(b.dataset.speaking){speakingIndex=(speakingIndex+Number(b.dataset.speaking)+speakingCards.length)%speakingCards.length;examView()}});
document.addEventListener('change',e=>{if(e.target.dataset.examQ!==undefined)examChoices[examSection][Number(e.target.dataset.examQ)]=Number(e.target.value);if(e.target.id==='writing-task'){writingIndex=Number(e.target.value);examView()}});
document.addEventListener('input',e=>{if(e.target.id==='exam-writing'){writingDrafts[writingIndex]=e.target.value;document.querySelector('#word-count').textContent=`${countWords(e.target.value)} words · Draft kept while this page is open.`}});

const allowedViews=['course','grammar','exam','words','review','worksheets'];
function routeFromHash(){const requested=location.hash.slice(1);if(allowedViews.includes(requested)){view=requested;render()}}
window.addEventListener('hashchange',routeFromHash);
document.addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(b&&allowedViews.includes(b.dataset.view))history.replaceState(null,'','#'+b.dataset.view)});
if(allowedViews.includes(location.hash.slice(1)))view=location.hash.slice(1);
render();
</script></body></html>

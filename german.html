:root{--paper:#f5f1e7;--ink:#21392f;--muted:#657067;--line:#d3d7c9;--accent:#e5ed91;--white:#fffcf5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 'DM Sans',sans-serif}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #ab6505;outline-offset:4px}header{padding:24px 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:24px}.brand{font:700 36px Georgia,serif;letter-spacing:-2px;color:inherit;text-decoration:none;line-height:1}.brand span{display:block;font:10px 'DM Sans',sans-serif;letter-spacing:2px;margin-top:12px}nav{display:flex;gap:12px}nav button{border:0;background:none;padding:9px 15px;font-size:14px}nav button.active{background:var(--ink);color:white;border-radius:24px}.level,.eyebrow{font-size:12px;letter-spacing:2px;font-weight:600}main{max-width:1440px;margin:auto;padding:44px 5% 70px}h1,h2,h3,p{margin-top:0}h1{font:normal clamp(48px,6vw,80px)/1.05 'Libre Caslon Display',Georgia,serif;letter-spacing:-2px;margin-bottom:20px}h2{font:normal 38px/1.15 'Libre Caslon Display',Georgia,serif}h3{font-size:20px;line-height:1.35;margin-bottom:12px}.intro{display:grid;grid-template-columns:1.7fr 1fr;gap:50px;align-items:center;margin-bottom:44px}.intro p{max-width:520px;color:var(--muted);margin-bottom:0}.stamp{background:var(--accent);padding:27px 32px;transform:rotate(2deg);border:1px solid var(--ink)}.stamp strong{font:normal 60px Georgia,serif}.stamp .row{border-top:1px solid #adb966;padding-top:12px;margin-top:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:15px}.workspace{display:grid;grid-template-columns:270px minmax(0,1fr);gap:30px}.syllabus{border-top:1px solid var(--ink)}.syllabus h3{font-size:12px;letter-spacing:2px;padding:18px 0 4px}.unit{width:100%;display:flex;gap:14px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:13px 8px;font-size:14px;line-height:1.4}.unit b{font-size:12px;font-weight:400;color:var(--muted);min-width:23px}.unit.selected{background:var(--ink);color:white}.unit.selected b{color:var(--accent)}.unit small{margin-left:auto}.lesson{background:var(--white);border:1px solid var(--line);padding:36px}.lesson-top{display:flex;justify-content:space-between;align-items:start;gap:12px}.lesson h2{font-size:42px;margin-bottom:12px}.subtle{color:var(--muted)}.pill{border:1px solid var(--line);border-radius:22px;padding:4px 12px;white-space:nowrap;font-size:12px}.tabs{display:flex;flex-wrap:wrap;gap:20px;border-bottom:1px solid var(--line);margin:22px 0 26px}.tabs button{border:0;border-bottom:3px solid transparent;background:none;padding:10px 0;font-size:14px}.tabs .selected{border-color:var(--ink);font-weight:700}.example{padding:20px 24px;margin:20px 0;background:#edf0e5;border-left:3px solid var(--ink)}.example strong{font-size:22px;font-weight:500}.example p{margin:4px 0 0}.primary,.secondary{border:1px solid var(--ink);padding:12px 20px;border-radius:3px;background:var(--ink);color:white;font-size:14px;font-weight:600}.secondary{background:transparent;color:var(--ink)}.audio{border:1px solid var(--line);background:transparent;border-radius:50%;width:40px;height:40px;font-size:18px;flex-shrink:0}.bottom{border-top:1px solid var(--line);padding-top:24px;margin-top:30px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.word{padding:18px;border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.word strong{display:block;font-size:18px}.word small{display:block;color:var(--muted);font-size:14px}.question{margin:24px 0}.options{display:grid;gap:8px}.option{text-align:left;background:transparent;border:1px solid var(--line);padding:12px 16px;border-radius:3px}.option:hover{border-color:var(--ink)}.option.correct{background:#dcebcf;border-color:#4c7136}.option.incorrect{background:#f7ded3;border-color:#a24928}.feedback{margin-top:12px;font-size:14px}.feedback:empty{display:none}details{border:1px solid var(--line);padding:15px;margin-top:16px}summary{cursor:pointer;font-size:14px;font-weight:600}textarea{width:100%;min-height:110px;background:var(--paper);padding:16px;border:1px solid var(--line);border-radius:3px;color:var(--ink);resize:vertical}label{display:block;margin:14px 0 8px}.dialogue{border-bottom:1px solid var(--line);padding:16px 0}.dialogue p{margin:3px 0}.flashcard{min-height:280px;background:var(--ink);color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;width:100%;border:0}.flashcard strong{font:42px Georgia,serif}.flashcard small{margin-top:22px;color:#d5ddc9}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:22px 0}select,input{padding:12px;border:1px solid var(--line);background:var(--white);color:var(--ink);max-width:100%}.progress{height:5px;background:var(--line);margin-top:20px}.progress span{display:block;background:var(--ink);height:100%}.notice{font-size:13px;color:var(--muted);margin-top:18px}.review-card{background:var(--white);padding:30px;border:1px solid var(--line)}footer{border-top:1px solid var(--line);margin:0 5%;padding:25px 0;display:flex;gap:20px;justify-content:space-between;font-size:12px;color:var(--muted)}footer b{font:24px Georgia,serif;color:var(--ink)}@media(max-width:850px){header{flex-wrap:wrap}.level{display:none}.intro{grid-template-columns:1fr 0.65fr;gap:20px}.workspace{grid-template-columns:210px minmax(0,1fr);gap:18px}.lesson{padding:24px}.grid{grid-template-columns:1fr}.stamp{padding:20px}.stamp strong{font-size:44px}}@media(max-width:620px){header{padding:20px;gap:20px}nav{width:100%;justify-content:space-between;gap:0}main{padding:30px 20px}.intro{grid-template-columns:1fr}.stamp{transform:none}.stamp strong{font-size:34px}.stamp{padding:18px 24px}.workspace{display:block}.syllabus{max-height:205px;overflow:auto;margin-bottom:24px}.syllabus h3{position:sticky;top:0;background:var(--paper);margin:0;padding:10px 0}.lesson{padding:22px}.lesson h2{font-size:34px}.lesson-top{display:block}.pill{display:inline-block;margin:6px 0}.tabs{gap:15px}footer{flex-wrap:wrap}.row{flex-wrap:wrap}.flashcard strong{font-size:32px}}

{title:'Hallo, Deutsch!',goal:'Greet someone and introduce yourself.',grammar:'Use du with friends, children, and people who invite you to be informal. Use Sie with adults in formal situations; always capitalize Sie. The verb changes with the person: ich bin, du bist, er/sie/es ist, wir sind, ihr seid, sie/Sie sind. With heißen: ich heiße, du heißt, er/sie heißt.',example:['Hallo! Ich heiße Alex. Wie heißen Sie?','Hello! My name is Alex. What is your name? (formal)'],words:[['Hallo','hello'],['Guten Morgen','good morning'],['Guten Tag','hello / good day'],['Guten Abend','good evening'],['Auf Wiedersehen','goodbye (formal)'],['Tschüss','bye'],['bitte','please / you’re welcome'],['danke','thank you'],['Entschuldigung','excuse me / sorry'],['ja / nein','yes / no']],dialogue:[['Hallo! Wie heißt du?','Hello! What is your name?'],['Ich heiße Mia. Und du?','My name is Mia. And you?'],['Ich bin Ben. Freut mich!','I’m Ben. Nice to meet you!']],quiz:[['Ich ___ Mia.',['bin','bist','sind'],0,'Ich takes bin.'],['Which is the formal question?',['Wie heißt du?','Wie heißen Sie?','Wie geht’s?'],1,'Sie is the formal form of you.']],speak:'Greet a new classmate, say your name, and ask their name.',write:'Write two sentences introducing yourself.',sample:'Hallo! Ich heiße Alex. Ich bin neu hier.'},
{title:'Sounds & spelling',goal:'Read common letter combinations and spell your name.',grammar:'German vowels can be long or short. The combination ie usually sounds like the vowel in “see”; ei like “eye”; eu and äu like “oy.” Sch sounds like “sh”; z like “ts”; w like English “v”; j like English “y.” ß sounds like “s.” For ü, shape your lips for “oo” while saying “ee”; for ö, round your lips while saying “eh.” Ch is softer after i/e and further back after a/o/u. Listen and imitate rather than relying only on English approximations.',example:['Wie schreibt man das? A–L–E–X.','How do you spell that? A–L–E–X.'],words:[['eins','one · ei'],['sieben','seven · ie'],['neun','nine · eu'],['schön','beautiful · sch / ö'],['fünf','five · ü'],['Straße','street · ß'],['Wasser','water · w'],['Zeit','time · z'],['ich','I · soft ch'],['Buch','book · back ch']],dialogue:[['Wie ist Ihr Name?','What is your name?'],['Mein Name ist Müller.','My name is Müller.'],['Wie schreibt man das?','How do you spell that?'],['M–Ü–L–L–E–R.','M–Ü–L–L–E–R.']],quiz:[['Which word contains the “eye” sound?',['sieben','eins','neun'],1,'Ei in eins sounds approximately like “eye.”'],['German w usually sounds like English…',['w','v','j'],1,'For example, Wasser starts with a v sound.']],speak:'Spell your name aloud. Say fünf, schön, ich, and Buch slowly.',write:'Write a polite request to repeat something.',sample:'Können Sie das bitte wiederholen?'},
{title:'You & your world',goal:'Share your age, home, country, and language.',grammar:'For regular verbs remove -en and add: ich -e, du -st, er/sie/es -t, wir -en, ihr -t, sie/Sie -en. Example: wohnen → ich wohne, du wohnst. Sprechen changes its vowel: du sprichst, er spricht. A question word comes first, then the verb: Wo wohnst du? Most countries take no article: aus Deutschland. Some do: aus der Schweiz, aus der Türkei. Numbers 21–99 say the unit before the tens: einundzwanzig = 21.',example:['Ich komme aus Kanada und wohne in Berlin. Ich bin 25 Jahre alt.','I come from Canada and live in Berlin. I am 25 years old.'],words:[['null, eins, zwei, drei','0, 1, 2, 3'],['vier, fünf, sechs','4, 5, 6'],['sieben, acht, neun, zehn','7, 8, 9, 10'],['elf, zwölf','11, 12'],['dreizehn, vierzehn, fünfzehn','13, 14, 15'],['sechzehn, siebzehn','16, 17'],['achtzehn, neunzehn, zwanzig','18, 19, 20'],['dreißig, vierzig, fünfzig','30, 40, 50'],['sechzig, siebzig, achtzig, neunzig','60, 70, 80, 90'],['hundert','100'],['wo / woher / wie','where / where from / how'],['Deutsch / Englisch','German / English']],dialogue:[['Woher kommst du?','Where are you from?'],['Ich komme aus Kanada.','I come from Canada.'],['Welche Sprachen sprichst du?','Which languages do you speak?'],['Ich spreche Englisch und ein bisschen Deutsch.','I speak English and a little German.']],quiz:[['What is einundzwanzig?',['12','21','31'],1,'Ein + und + zwanzig = one and twenty.'],['Wo ___ du?',['wohne','wohnt','wohnst'],2,'Du takes the ending -st.']],speak:'Say your phone number one digit at a time, then your age.',write:'Introduce your country, city, and languages.',sample:'Ich komme aus Kanada. Ich wohne in Toronto. Ich spreche Englisch und ein bisschen Deutsch.'},
{title:'Family & friends',goal:'Introduce the people in your life.',grammar:'Personal pronouns: ich (I), du (you), er (he), sie (she), es (it), wir (we), ihr (you plural), sie (they), Sie (formal you). Possessives agree with the noun: mein Vater, meine Mutter, mein Kind, meine Eltern. The same pattern works for dein (your), sein (his/its), ihr (her/their), unser (our), euer (your plural), Ihr (formal your). For feminine/plural euer becomes eure.',example:['Das ist meine Schwester. Sie heißt Lea.','This is my sister. Her name is Lea.'],words:[['die Mutter · Mütter','mother'],['der Vater · Väter','father'],['die Eltern (plural)','parents'],['die Schwester · Schwestern','sister'],['der Bruder · Brüder','brother'],['das Kind · Kinder','child'],['die Frau · Frauen','woman / wife'],['der Mann · Männer','man / husband'],['der Freund · Freunde','friend (male) / boyfriend'],['die Freundin · Freundinnen','friend (female) / girlfriend']],dialogue:[['Ist das dein Bruder?','Is that your brother?'],['Ja, das ist mein Bruder Max.','Yes, that is my brother Max.'],['Wie alt ist er?','How old is he?'],['Er ist acht Jahre alt.','He is eight years old.']],quiz:[['Das ist ___ Mutter.',['mein','meine','meinen'],1,'Mutter is feminine: meine Mutter.'],['“We” in German is…',['ihr','sie','wir'],2,'Wir means we.']],speak:'Introduce two real or imaginary family members.',write:'Write three sentences about a friend.',sample:'Das ist meine Freundin Anna. Sie wohnt in Bonn. Sie spricht Deutsch.'},
{title:'Things around you',goal:'Use articles and learn nouns with their plurals.',grammar:'All German nouns begin with a capital letter. Learn each noun with its article and plural: der Tisch, die Tische. Der is masculine, die feminine, das neuter; all plural nouns use die. An indefinite article means a/an: ein Tisch, eine Lampe, ein Buch. There is no plural indefinite article: Bücher. Grammatical gender does not reliably follow meaning, so memorize it with each noun.',example:['Das ist ein Buch. Die Bücher sind interessant.','That is a book. The books are interesting.'],words:[['der Tisch · Tische','table'],['der Stuhl · Stühle','chair'],['das Buch · Bücher','book'],['die Tasche · Taschen','bag'],['der Schlüssel · Schlüssel','key'],['das Handy · Handys','mobile phone'],['die Lampe · Lampen','lamp'],['der Stift · Stifte','pen'],['das Fenster · Fenster','window'],['die Tür · Türen','door']],dialogue:[['Was ist das auf Deutsch?','What is that in German?'],['Das ist ein Schlüssel.','That is a key.'],['Und das?','And that?'],['Das sind Bücher.','Those are books.']],quiz:[['Which is correct?',['eine Buch','ein Buch','einen Buch'],1,'Buch is neuter: das Buch / ein Buch.'],['The definite article for all plural nouns is…',['der','das','die'],2,'Die Bücher, die Tische, die Lampen.']],speak:'Name five things in your room with their articles.',write:'Describe three objects using Das ist …',sample:'Das ist ein Tisch. Das ist eine Lampe. Das ist ein Buch.'},
{title:'Everyday routines',goal:'Build statements and questions in the present tense.',grammar:'In a main statement, the conjugated verb is the second sentence element: Ich lerne heute Deutsch. Heute lerne ich Deutsch. A yes/no question starts with the verb: Lernst du Deutsch? Add -e- for pronunciation with verbs like arbeiten: du arbeitest, er arbeitet. Common changes: lesen → du liest, er liest; fahren → du fährst, er fährt. Haben: ich habe, du hast, er hat, wir haben, ihr habt, sie haben.',example:['Heute arbeite ich zu Hause. Lernst du Deutsch?','Today I work at home. Are you learning German?'],words:[['lernen','to learn'],['arbeiten','to work'],['lesen','to read'],['schreiben','to write'],['machen','to do / make'],['gehen','to go'],['fahren','to travel / drive'],['haben','to have'],['heute','today'],['jeden Tag','every day']],dialogue:[['Was machst du heute?','What are you doing today?'],['Ich arbeite und lerne Deutsch.','I work and learn German.'],['Liest du auch?','Do you also read?'],['Ja, ich lese ein Buch.','Yes, I read a book.']],quiz:[['Which sentence is correct?',['Heute ich lerne Deutsch.','Heute lerne ich Deutsch.','Heute Deutsch ich lerne.'],1,'The conjugated verb lerne is the second element.'],['___ du ein Auto?',['Haben','Hat','Hast'],2,'Du hast becomes Hast du …? in a question.']],speak:'Say three things you do every day.',write:'Describe your day in three sentences, starting one with Heute.',sample:'Ich arbeite jeden Tag. Heute lerne ich Deutsch. Am Abend lese ich ein Buch.'},
{title:'Time & plans',goal:'Tell the time and arrange a meeting.',grammar:'Use um with clock times, am with days/dates, im with months/seasons: um neun Uhr, am Montag, im Mai. Halb drei means 2:30—halfway to three. Viertel nach zwei = 2:15; Viertel vor drei = 2:45. Separable verbs split in a main clause: Ich stehe um sieben Uhr auf. Dates use ordinal numbers: am ersten Mai, am dritten Juni; from 20 onward the ordinal usually ends in -sten.',example:['Am Montag stehe ich um sieben Uhr auf.','On Monday I get up at seven o’clock.'],words:[['Montag, Dienstag, Mittwoch','Monday, Tuesday, Wednesday'],['Donnerstag, Freitag','Thursday, Friday'],['Samstag, Sonntag','Saturday, Sunday'],['Januar, Februar, März','January, February, March'],['April, Mai, Juni','April, May, June'],['Juli, August, September','July, August, September'],['Oktober, November, Dezember','October, November, December'],['aufstehen','to get up'],['anfangen','to begin'],['der Termin · Termine','appointment']],dialogue:[['Wann treffen wir uns?','When shall we meet?'],['Am Dienstag um halb drei.','On Tuesday at half past two.'],['Also um vierzehn Uhr dreißig?','So at fourteen thirty?'],['Ja, genau!','Yes, exactly!']],quiz:[['Halb acht means…',['7:30','8:30','8:00'],0,'Halb points to the coming hour: half to eight.'],['Ich stehe um sechs Uhr ___.',['an','auf','aus'],1,'Aufstehen splits: ich stehe … auf.']],speak:'Say today’s date and three appointment times.',write:'Suggest a meeting day and time.',sample:'Hast du am Freitag Zeit? Wir treffen uns um fünfzehn Uhr im Café.'},
{title:'At the café',goal:'Order food and drinks politely.',grammar:'The direct object usually takes the accusative. Masculine articles change: der → den, ein → einen. Feminine, neuter, and plural articles stay the same as in the nominative. Ich möchte einen Kaffee. Möchten is a polite “would like”: ich möchte, du möchtest, er möchte, wir möchten, ihr möchtet, Sie möchten. Nehmen changes to du nimmst, er nimmt.',example:['Ich möchte einen Kaffee und ein Wasser, bitte.','I would like a coffee and a water, please.'],words:[['der Kaffee · Kaffees','coffee'],['der Tee · Tees','tea'],['das Wasser (usually singular)','water'],['das Brot · Brote','bread'],['das Brötchen · Brötchen','bread roll'],['der Käse (usually singular)','cheese'],['die Milch (usually singular)','milk'],['der Apfel · Äpfel','apple'],['die Rechnung · Rechnungen','bill'],['bezahlen','to pay']],dialogue:[['Was möchten Sie?','What would you like?'],['Einen Tee und ein Brötchen, bitte.','A tea and a bread roll, please.'],['Sonst noch etwas?','Anything else?'],['Nein, danke. Die Rechnung, bitte.','No, thank you. The bill, please.']],quiz:[['Ich möchte ___ Kaffee.',['ein','einen','eine'],1,'Kaffee is masculine and the direct object: einen Kaffee.'],['“The bill, please” is…',['Die Rechnung, bitte.','Guten Appetit!','Wie bitte?'],0,'Use Die Rechnung, bitte to request the bill.']],speak:'Order two drinks and something to eat.',write:'Write your breakfast order.',sample:'Ich möchte einen Tee, ein Brötchen und einen Apfel, bitte.'},
{title:'Shopping & prices',goal:'Ask about prices and say what you need.',grammar:'Use kein to negate a noun with ein or no article: Ich habe kein Auto. Ich kaufe keine Schuhe. In the masculine accusative use keinen: Ich brauche keinen Mantel. Use nicht for verbs, adjectives, and other phrases: Das ist nicht teuer. Ich komme heute nicht. Prices: drei Euro fünfzig = €3.50. Adjectives after sein do not take an ending: Die Schuhe sind blau.',example:['Was kostet die Jacke? Sie kostet vierzig Euro.','How much does the jacket cost? It costs forty euros.'],words:[['die Jacke · Jacken','jacket'],['die Hose · Hosen','trousers'],['der Schuh · Schuhe','shoe'],['das Hemd · Hemden','shirt'],['die Größe · Größen','size'],['rot / blau / grün','red / blue / green'],['schwarz / weiß / gelb','black / white / yellow'],['teuer / billig','expensive / cheap'],['groß / klein','big / small'],['kaufen / kosten','to buy / to cost']],dialogue:[['Haben Sie die Jacke in Größe M?','Do you have the jacket in size M?'],['Ja. Die Jacke kostet fünfzig Euro.','Yes. The jacket costs fifty euros.'],['Kann ich mit Karte bezahlen?','Can I pay by card?'],['Ja, natürlich.','Yes, of course.']],quiz:[['Das ist ___ teuer.',['kein','nicht','keine'],1,'Nicht negates the adjective teuer.'],['Ich habe ___ Auto.',['keinen','keine','kein'],2,'Auto is neuter: kein Auto.']],speak:'Ask for an item, its size, and its price.',write:'Describe a clothing item and its price.',sample:'Die Jacke ist blau. Sie kostet fünfzig Euro. Sie ist nicht billig.'},
{title:'At home',goal:'Describe your home and say where things are.',grammar:'Es gibt means “there is / there are” and takes the accusative: Es gibt einen Balkon. To state location, in/auf/unter/neben/vor/hinter/über/zwischen/an take the dative: auf dem Tisch, in der Küche. Dative articles: der/das → dem, die → der, plural die → den (usually add -n to the noun if possible). Compare location Wo? with destination Wohin?: Ich bin in der Küche; ich gehe in die Küche.',example:['Die Lampe steht auf dem Tisch. Es gibt einen Balkon.','The lamp is on the table. There is a balcony.'],words:[['die Wohnung · Wohnungen','apartment'],['das Zimmer · Zimmer','room'],['die Küche · Küchen','kitchen'],['das Bad · Bäder','bathroom'],['das Schlafzimmer · Schlafzimmer','bedroom'],['das Bett · Betten','bed'],['der Schrank · Schränke','cupboard / wardrobe'],['der Balkon · Balkone','balcony'],['die Miete · Mieten','rent'],['hell / ruhig','bright / quiet']],dialogue:[['Wie ist deine Wohnung?','What is your apartment like?'],['Sie ist klein, aber hell.','It is small but bright.'],['Gibt es einen Balkon?','Is there a balcony?'],['Ja, neben dem Wohnzimmer.','Yes, next to the living room.']],quiz:[['Es gibt ___ Balkon.',['ein','einen','einem'],1,'Es gibt takes the accusative: einen Balkon.'],['The fixed location “in the kitchen” is…',['in der Küche','in die Küche','in dem Küche'],0,'Küche is feminine. Static location uses dative: der Küche.']],speak:'Describe your room and the position of three objects.',write:'Write a short apartment description.',sample:'Meine Wohnung hat zwei Zimmer. Die Küche ist klein. Es gibt einen Balkon.'},
{title:'Around town',goal:'Find your way and use public transport.',grammar:'Use nach for cities and most countries without articles: nach Berlin, nach Deutschland. Use zu for many destinations involving people/buildings: zum Arzt, zur Bank. Zum = zu dem; zur = zu der. Mit takes the dative: mit dem Bus, mit der Bahn. Useful fixed expressions: nach Hause (homeward), zu Hause (at home), am Bahnhof (at the station). Polite directions often use Sie: Gehen Sie geradeaus.',example:['Ich fahre mit dem Bus zum Bahnhof.','I’m going to the station by bus.'],words:[['der Bahnhof · Bahnhöfe','train station'],['die Haltestelle · Haltestellen','stop'],['der Bus · Busse','bus'],['der Zug · Züge','train'],['die Fahrkarte · Fahrkarten','ticket'],['die Bank · Banken','bank'],['die Apotheke · Apotheken','pharmacy'],['links / rechts','left / right'],['geradeaus','straight ahead'],['einsteigen / aussteigen','to board / get off']],dialogue:[['Entschuldigung, wo ist der Bahnhof?','Excuse me, where is the train station?'],['Gehen Sie geradeaus und dann links.','Go straight ahead and then left.'],['Ist das weit?','Is it far?'],['Nein, fünf Minuten zu Fuß.','No, five minutes on foot.']],quiz:[['Ich fahre ___ Berlin.',['zu','nach','bei'],1,'Cities take nach when describing travel to them.'],['Mit ___ Bus.',['den','der','dem'],2,'Mit takes dative: dem Bus.']],speak:'Give directions from your home to a nearby place.',write:'Ask for a ticket to Berlin.',sample:'Guten Tag! Ich möchte eine Fahrkarte nach Berlin, bitte. Wann fährt der Zug?'},
{title:'Free time',goal:'Talk about hobbies and make plans.',grammar:'Gern after a verb means you like doing it: Ich schwimme gern. Lieber expresses a preference: Ich lese lieber. Modal verbs send the other verb to the end in its infinitive form: Ich kann gut schwimmen. Können: kann, kannst, kann, können, könnt, können. Wollen: will, willst, will, wollen, wollt, wollen. Negate ability with nicht: Ich kann nicht kommen.',example:['Am Samstag will ich Fußball spielen. Kommst du mit?','On Saturday I want to play football. Are you coming along?'],words:[['schwimmen','to swim'],['tanzen','to dance'],['kochen','to cook'],['Musik hören','to listen to music'],['Fußball spielen','to play football'],['spazieren gehen','to go for a walk'],['das Kino · Kinos','cinema'],['das Wochenende · Wochenenden','weekend'],['gern / lieber','gladly / preferably'],['Zeit haben','to have time']],dialogue:[['Was machst du gern?','What do you like doing?'],['Ich schwimme gern. Und du?','I like swimming. And you?'],['Ich gehe gern ins Kino. Hast du morgen Zeit?','I like going to the cinema. Do you have time tomorrow?'],['Ja, gern!','Yes, I’d love to!']],quiz:[['Ich kann gut ___.',['schwimme','schwimmen','schwimmt'],1,'The second verb stays in its infinitive form after können.'],['Ich lese gern means…',['I must read.','I like reading.','I cannot read.'],1,'Gern expresses enjoyment of an activity.']],speak:'Name two hobbies you like and one you don’t like.',write:'Invite a friend to an activity.',sample:'Hallo Mia! Hast du am Samstag Zeit? Ich möchte ins Kino gehen. Kommst du mit?'},
{title:'Work & study',goal:'Understand simple requests, rules, and schedules.',grammar:'Müssen expresses necessity: ich muss, du musst, er muss, wir müssen, ihr müsst, sie müssen. Dürfen expresses permission: ich darf, du darfst, er darf, wir dürfen, ihr dürft, sie dürfen. Nicht dürfen means must not; nicht müssen means do not have to. For polite instructions use verb + Sie: Öffnen Sie das Buch. Informal commands: Komm bitte! / Kommt bitte! After sein, jobs usually have no article: Ich bin Lehrer.',example:['Ich muss heute arbeiten. Hier dürfen Sie nicht rauchen.','I have to work today. You must not smoke here.'],words:[['der Beruf · Berufe','profession'],['der Lehrer · Lehrer','teacher (male)'],['die Lehrerin · Lehrerinnen','teacher (female)'],['das Büro · Büros','office'],['die Schule · Schulen','school'],['die Universität · Universitäten','university'],['die Pause · Pausen','break'],['die Aufgabe · Aufgaben','task'],['öffnen / schließen','to open / close'],['verstehen','to understand']],dialogue:[['Was sind Sie von Beruf?','What is your profession?'],['Ich bin Lehrerin.','I am a teacher.'],['Wann beginnt Ihre Arbeit?','When does your work begin?'],['Um acht Uhr.','At eight o’clock.']],quiz:[['Sie dürfen hier nicht rauchen means…',['You don’t have to smoke here.','You must not smoke here.','You want to smoke here.'],1,'Nicht dürfen expresses prohibition.'],['Polite instruction: ___ Sie bitte das Buch.',['Öffnen','Öffnest','Öffnet'],0,'The formal imperative uses infinitive-form verb + Sie.']],speak:'Say your job or what you study and when your day starts.',write:'Write a short request for help.',sample:'Entschuldigung, ich verstehe die Aufgabe nicht. Können Sie mir bitte helfen?'},
{title:'Health & help',goal:'Describe basic symptoms and make an appointment.',grammar:'Say Ich habe Kopfschmerzen (I have a headache) or Mein Kopf tut weh (my head hurts). A plural subject takes tun: Meine Füße tun weh. Sollen often passes on advice: Der Arzt sagt, ich soll viel trinken. Sollen: soll, sollst, soll, sollen, sollt, sollen. Use a modal plus an infinitive at the end: Ich muss einen Termin machen.',example:['Ich bin krank. Mein Hals tut weh.','I am ill. My throat hurts.'],words:[['der Kopf · Köpfe','head'],['der Hals · Hälse','throat / neck'],['der Bauch · Bäuche','belly'],['der Rücken · Rücken','back'],['die Hand · Hände','hand'],['der Fuß · Füße','foot'],['die Schmerzen (plural)','pain / pains'],['das Fieber (usually singular)','fever'],['der Arzt · Ärzte','doctor (male)'],['die Ärztin · Ärztinnen','doctor (female)']],dialogue:[['Guten Tag. Ich brauche einen Termin.','Hello. I need an appointment.'],['Was fehlt Ihnen?','What is wrong?'],['Ich habe Fieber und Kopfschmerzen.','I have a fever and a headache.'],['Können Sie heute um zehn Uhr kommen?','Can you come today at ten?']],quiz:[['Meine Füße ___ weh.',['tut','tun','tust'],1,'Füße is plural, so use tun.'],['Ich soll viel ___.',['trinke','trinkt','trinken'],2,'Sollen is followed by the infinitive trinken.']],speak:'Role-play making an appointment and naming a symptom.',write:'Write a message saying you cannot come because you are ill.',sample:'Hallo Ben, ich bin krank und habe Fieber. Ich kann heute nicht kommen. Viele Grüße, Alex'},
{title:'Travel & weather',goal:'Book a room and discuss simple travel plans.',grammar:'Use im for seasons: im Sommer, im Winter. Common weather expressions use es: Es regnet. Es ist kalt. For an overnight stay say für zwei Nächte; für takes accusative. Von … bis … gives a range: vom dritten bis zum fünften Mai. Vom = von dem. Questions: Wann? (when), Wie lange? (how long), Wie viel? (how much), Welche? (which).',example:['Ich möchte ein Zimmer für zwei Nächte reservieren.','I would like to reserve a room for two nights.'],words:[['das Hotel · Hotels','hotel'],['das Einzelzimmer · Einzelzimmer','single room'],['das Doppelzimmer · Doppelzimmer','double room'],['die Nacht · Nächte','night'],['das Frühstück (usually singular)','breakfast'],['der Urlaub · Urlaube','holiday'],['der Frühling / der Sommer','spring / summer'],['der Herbst / der Winter','autumn / winter'],['warm / kalt','warm / cold'],['Es regnet. / Die Sonne scheint.','It’s raining. / The sun is shining.']],dialogue:[['Haben Sie ein Zimmer frei?','Do you have a room available?'],['Ja. Für wie viele Nächte?','Yes. For how many nights?'],['Für zwei Nächte. Ist das Frühstück inklusive?','For two nights. Is breakfast included?'],['Ja, das Frühstück ist inklusive.','Yes, breakfast is included.']],quiz:[['___ Sommer ist es oft warm.',['Am','Um','Im'],2,'Seasons take im: im Sommer.'],['Für zwei ___ .',['Nächte','Nacht','Nächten'],0,'Für takes accusative: zwei Nächte.']],speak:'Ask for a room and ask about breakfast and the price.',write:'Write a short room reservation request.',sample:'Guten Tag, ich möchte ein Doppelzimmer für zwei Nächte reservieren. Haben Sie vom 3. bis zum 5. Mai ein Zimmer frei? Was kostet das Zimmer?'},
{title:'Yesterday',goal:'Talk about simple past events.',grammar:'The conversational past (Perfekt) combines haben or sein with a past participle at the end: Ich habe Deutsch gelernt. Regular participles often use ge- + stem + -t: gemacht, gelernt. Common irregular ones: gegessen, getrunken, gelesen, geschrieben, gesehen. Many verbs of movement/change use sein: Ich bin nach Berlin gefahren. Separable: eingekauft, aufgestanden. Verbs in -ieren and verbs with inseparable prefixes such as be- do not add ge-: studiert, besucht. Sein/haben often use war/hatte: Ich war müde. Ich hatte Zeit.',example:['Gestern habe ich gekocht. Danach bin ich ins Kino gegangen.','Yesterday I cooked. After that I went to the cinema.'],words:[['gestern','yesterday'],['letzte Woche','last week'],['gemacht / gelernt','done / learned'],['gegessen / getrunken','eaten / drunk'],['gelesen / geschrieben','read / written'],['gesehen','seen'],['gegangen / gefahren','gone / traveled'],['eingekauft','shopped'],['war / hatte','was / had (I or he/she/it)'],['danach','after that']],dialogue:[['Was hast du gestern gemacht?','What did you do yesterday?'],['Ich habe eingekauft und gekocht.','I shopped and cooked.'],['Bist du zu Hause geblieben?','Did you stay at home?'],['Ja, ich war müde.','Yes, I was tired.']],quiz:[['Ich ___ nach Berlin gefahren.',['habe','bin','hat'],1,'Travel from one place to another with fahren uses sein.'],['Ich habe Deutsch ___.',['gelernt','lernen','lerne'],0,'Perfekt uses a past participle: gelernt.']],speak:'Say three things you did yesterday.',write:'Write a short message about your weekend.',sample:'Am Samstag habe ich eingekauft. Am Sonntag bin ich ins Kino gegangen. Der Film war gut.'},
{title:'Messages & forms',goal:'Write short everyday messages and fill out personal details.',grammar:'Und (and), aber (but), oder (or), and denn (because) connect main clauses without sending the verb to the end: Ich komme nicht, denn ich bin krank. Write informal messages with Hallo/Liebe/Lieber and end with Viele Grüße. Formal messages can start Sehr geehrte Frau … / Sehr geehrter Herr … and end Mit freundlichen Grüßen. After a greeting followed by a comma, the next word is normally lowercase unless it is a noun or Sie.',example:['Hallo Mia, ich komme später, denn mein Zug hat Verspätung.','Hi Mia, I’m coming later because my train is delayed.'],words:[['der Vorname · Vornamen','first name'],['der Nachname · Nachnamen','surname'],['das Geburtsdatum · Geburtsdaten','date of birth'],['die Adresse · Adressen','address'],['die Postleitzahl · Postleitzahlen','postal code'],['die Unterschrift · Unterschriften','signature'],['ledig / verheiratet','single / married'],['die Einladung · Einladungen','invitation'],['die Verspätung · Verspätungen','delay'],['Viele Grüße','best wishes']],dialogue:[['Kommst du zu meiner Party?','Are you coming to my party?'],['Ja, gern. Wann beginnt sie?','Yes, I’d love to. When does it start?'],['Am Samstag um sieben Uhr.','On Saturday at seven.'],['Danke für die Einladung!','Thank you for the invitation!']],quiz:[['Ich komme nicht, denn ich ___ krank.',['bin','sein','bist'],0,'Denn keeps normal main-clause word order: ich bin krank.'],['Nachname means…',['first name','surname','nickname'],1,'Nachname is family name or surname.']],speak:'Ask someone for their name, address, and postal code.',write:'Decline an invitation, give a reason, and suggest another day.',sample:'Hallo Mia, danke für die Einladung. Ich kann am Samstag nicht kommen, denn ich muss arbeiten. Hast du am Sonntag Zeit? Viele Grüße, Alex'}
];
</script><script>const grammarTopics=[
{title:'How a German sentence works',tag:'Start here',units:[0,2,5],intro:'Before learning endings, learn to spot the parts of a sentence. This makes the other rules much easier to understand.',steps:[['Find the verb','The verb describes an action or state: lernen (learn), wohnen (live), sein (be). An infinitive is the dictionary form, often ending in -en. A conjugated verb has changed to match its subject: lernen becomes lerne in ich lerne.'],['Find the subject','The subject tells you who or what does the action. In Der Mann kauft ein Buch, der Mann is the subject. Ask “Who buys?” The subject uses the nominative case. A pronoun can replace a noun: Der Mann → er.'],['Find the object','An object completes the meaning of many verbs. In Der Mann kauft ein Buch, ein Buch is what he buys: the direct object, usually accusative. Not every sentence needs an object: Ich schlafe is complete.'],['Put the conjugated verb second','In an ordinary statement, the conjugated verb is the second element, not necessarily the second word. You can start with the subject or a time/place phrase. If something else comes first, put the subject after the verb.']],headers:['First element','Conjugated verb','Rest of sentence'],rows:[['Ich','lerne','heute Deutsch.'],['Heute','lerne','ich Deutsch.'],['Am Montag','lerne','ich Deutsch.']],examples:[['Der Mann kauft ein Buch.','The man buys a book.','Der Mann = subject; kauft = conjugated verb; ein Buch = direct object.'],['Heute arbeite ich zu Hause.','Today I work at home.','Heute fills position 1; arbeite fills position 2; ich follows the verb.']],mistake:['Heute ich lerne Deutsch.','Heute lerne ich Deutsch.','The verb must be the second element, even when the sentence begins with a time expression.'],quiz:[['In “Mia kauft einen Kaffee,” which part is the subject?',['Mia','kauft','einen Kaffee'],0,'Mia is the person doing the buying.'],['Choose the correct word order.',['Am Abend ich lese.','Am Abend lese ich.','Am Abend lesen ich.'],1,'Am Abend is one sentence element. The conjugated verb lese follows it.'],['Which is an infinitive?',['lernst','lerne','lernen'],2,'Lernen is the dictionary form; lerne and lernst are conjugated.']]},
{title:'Pronouns, sein & haben',tag:'People & verbs',units:[0,3,5],intro:'German verbs change depending on who is doing something. Start with the two verbs you will use constantly: sein (to be) and haben (to have).',steps:[['Choose the right “you”','Du addresses one person informally. Ihr addresses two or more people informally. Sie is polite/formal and can address one person or a group. Formal Sie always begins with a capital letter, even in the middle of a sentence.'],['Tell sie and Sie apart','Lowercase sie can mean she or they. Use the verb and context: sie ist = she is; sie sind = they are. Sie sind can mean you are (formal), or they are at the beginning of a sentence.'],['Use sein for identity, age, and descriptions','Say Ich bin Alex, Ich bin zwanzig Jahre alt, and Ich bin müde. German uses sein for age, unlike languages that say “I have twenty years.” After sein, a profession usually has no article: Ich bin Lehrerin.'],['Use haben for possession and common expressions','Say Ich habe ein Buch (I have a book), Ich habe Zeit (I have time), or Ich habe Hunger (I am hungry). Learn such expressions as complete phrases.']],headers:['Subject','sein · to be','haben · to have'],rows:[['ich · I','bin','habe'],['du · you','bist','hast'],['er / sie / es','ist','hat'],['wir · we','sind','haben'],['ihr · you all','seid','habt'],['sie / Sie','sind','haben']],examples:[['Seid ihr müde?','Are you all tired?','Ihr takes seid. The verb comes first in a yes/no question.'],['Haben Sie Zeit?','Do you have time? (formal)','Formal Sie uses haben, like wir and plural sie.']],mistake:['Ich habe 20 Jahre alt.','Ich bin 20 Jahre alt.','Age uses sein. The phrase Jahre alt means years old.'],quiz:[['Meine Schwester ___ müde.',['bist','ist','sind'],1,'Meine Schwester can be replaced by sie (she), so use ist.'],['___ ihr Zeit?',['Haben','Hast','Habt'],2,'Ihr takes habt.'],['Which addresses one person formally?',['Bist du Alex?','Sind Sie Alex?','Seid ihr Alex?'],1,'Sind Sie …? is the formal question.']]},
{title:'Present-tense verb endings',tag:'Verb forms',units:[2,5],intro:'The present tense covers what you do now, what you usually do, and often a future plan when a time expression makes it clear.',steps:[['Build a regular verb','Take the infinitive lernen, remove -en to get lern-, and add the ending for the subject. Memorize the six-person pattern below. German has no separate “I am learning” form: ich lerne can mean I learn or I am learning.'],['Add a helping e when pronunciation needs it','A stem ending in -t or -d usually adds e before -st or -t: arbeiten → du arbeitest, er arbeitet, ihr arbeitet; finden → du findest. A few other consonant combinations do this too, such as du öffnest.'],['Watch s-like sounds','After a stem ending in s, ß, x, or z, the du form usually has -t instead of an extra -st: heißen → du heißt; tanzen → du tanzt. The ich form remains ich heiße or ich tanze.'],['Learn vowel-changing verbs','Some common verbs change the stem vowel only with du and er/sie/es in the present: fahren → fährst/fährt, lesen → liest/liest, sprechen → sprichst/spricht. Wir and sie/Sie keep the infinitive form. These changes must be learned with the verb.']],headers:['Subject','Regular: lernen','Irregular: sprechen'],rows:[['ich','lerne','spreche'],['du','lernst','sprichst'],['er / sie / es','lernt','spricht'],['wir','lernen','sprechen'],['ihr','lernt','sprecht'],['sie / Sie','lernen','sprechen']],examples:[['Morgen arbeite ich in Berlin.','Tomorrow I work in Berlin.','Morgen tells us this present-tense sentence is a future plan.'],['Du liest, aber wir lesen.','You read, but we read.','The vowel changes with du, not with wir.']],mistake:['Du sprechst Deutsch.','Du sprichst Deutsch.','Sprechen changes e to i in du sprichst and er/sie/es spricht.'],quiz:[['Du ___ heute.',['arbeitst','arbeitest','arbeiten'],1,'Arbeiten adds e for pronunciation: arbeitest.'],['Er ___ nach Bonn.',['fahrt','fahren','fährt'],2,'Fahren changes a to ä with er/sie/es.'],['Wir ___ Deutsch.',['sprechen','spricht','sprichst'],0,'Wir uses the -en form without a stem-vowel change.']]},
{title:'Questions & question words',tag:'Word order',units:[0,2,5,14],intro:'German has two basic question patterns. In both, pay attention to the position of the conjugated verb.',steps:[['Ask a yes/no question','Start with the conjugated verb, then the subject: Wohnst du in Berlin? German does not add an extra “do”: do you live becomes wohnst du. For a modal verb, the modal comes first and the infinitive stays last: Kannst du kommen?'],['Ask for specific information','Start with a question word, then the conjugated verb and usually the subject: Wo wohnst du? A multiword question phrase also occupies one position: Wie viele Kinder hast du?'],['Choose the question word by meaning','Wo asks for location. Wohin asks for a destination. Woher asks for origin. Wann asks when; wie lange asks duration. Wie viel asks an amount; wie viele asks a number of countable things.'],['Use wer for the person doing something','Wer means who and can itself be the subject: Wer wohnt hier? You do not need a second subject such as du in that question. The verb normally takes the third-person singular form.']],headers:['Question','Meaning','Example'],rows:[['Wer? / Was?','Who? / What?','Wer kommt? / Was machst du?'],['Wo?','Where? (location)','Wo wohnst du?'],['Wohin? / Woher?','Where to? / Where from?','Wohin fährst du?'],['Wann? / Wie lange?','When? / How long?','Wann beginnt der Kurs?'],['Wie viel? / Wie viele?','How much? / How many?','Wie viele Bücher hast du?'],['Warum? / Wie?','Why? / How?','Warum lernst du Deutsch?']],examples:[['Hast du am Freitag Zeit?','Do you have time on Friday?','Verb + subject + the rest.'],['Um wie viel Uhr beginnt der Kurs?','At what time does the course begin?','The whole question phrase comes before beginnt.']],mistake:['Wo du wohnst?','Wo wohnst du?','In a direct question with wo, the conjugated verb comes immediately after the question word.'],quiz:[['Ask someone where they come from.',['Woher kommst du?','Wohin kommst du?','Wann kommst du?'],0,'Woher asks about origin.'],['Choose a yes/no question.',['Du hast Zeit?','Hast du Zeit?','Wo hast du Zeit?'],1,'The standard yes/no question begins with the verb.'],['___ Kinder hast du?',['Wie lange','Wie viel','Wie viele'],2,'Kinder are countable, so use wie viele.']]},
{title:'Nouns, gender & plurals',tag:'Articles',units:[3,4],intro:'Every German noun has a grammatical gender. Learn the article and plural together with the noun instead of learning an isolated English translation.',steps:[['Capitalize nouns','German nouns begin with a capital letter wherever they occur: ein Buch, meine Mutter, das Essen. Verbs and adjectives are normally lowercase unless they begin a sentence or are used as nouns.'],['Learn der, die, and das','Der marks masculine, die feminine, and das neuter in the nominative. Grammatical gender is not the same as biological gender: das Mädchen (girl) is neuter because words ending in -chen are neuter.'],['Use ein for “a” or “an”','In the nominative, use ein with masculine and neuter nouns and eine with feminine nouns. There is no plural form of a/an: ein Buch → Bücher. The definite plural article is always die.'],['Learn the plural as part of the word','Common plural patterns include -e, -er, -(e)n, -s, and no ending. Some also add an umlaut. There is no single plural rule that works for every noun. Useful clues: nouns ending in -ung are feminine and form plurals in -en; diminutives in -chen are neuter with no plural ending.']],headers:['Singular','A / an','Plural'],rows:[['der Tisch','ein Tisch','die Tische'],['die Lampe','eine Lampe','die Lampen'],['das Buch','ein Buch','die Bücher'],['der Schlüssel','ein Schlüssel','die Schlüssel'],['das Auto','ein Auto','die Autos'],['das Mädchen','ein Mädchen','die Mädchen']],examples:[['Das ist ein Buch. Die Bücher sind neu.','That is a book. The books are new.','Ein is neuter singular. Die is plural regardless of the original gender.'],['Ich kaufe Bücher.','I buy books.','No indefinite article is needed for plural books.']],mistake:['Eine Buch.','Ein Buch.','Buch is neuter. Learn it as das Buch, die Bücher.'],quiz:[['Which noun phrase is correct?',['eine Tisch','ein Tisch','ein Lampe'],1,'Tisch is masculine: ein Tisch.'],['The plural of das Buch is…',['die Bücher','das Bücher','die Buchs'],0,'Buch takes an umlaut and -er: Bücher.'],['Why is Mädchen neuter?',['All people are neuter.','It is plural.','The ending -chen makes it neuter.'],2,'Diminutive nouns ending in -chen are neuter.']]},
{title:'Nominative & accusative',tag:'Cases',units:[4,7,8,9],intro:'A case shows the role of a noun phrase in a sentence. At A1, first learn the subject and the direct object: nominative and accusative.',steps:[['Identify the subject','Ask who or what is doing the action. In Der Mann sieht den Hund, der Mann is the subject and uses nominative. A noun after sein that identifies the subject is also nominative: Er ist ein Lehrer.'],['Identify the direct object','Ask what or whom the subject sees, buys, needs, or has. In Ich kaufe einen Kaffee, einen Kaffee is the direct object and takes accusative. Common accusative verbs include haben, kaufen, brauchen, sehen, and möchten when followed by a noun.'],['Change masculine articles','The most visible A1 change is masculine: der becomes den, and ein becomes einen. Feminine, neuter, and plural articles look the same in these two cases. Possessives and kein follow the same masculine change: meinen Bruder, keinen Kaffee.'],['Learn es gibt as a fixed pattern','Es gibt means there is or there are. What exists follows in the accusative: Es gibt einen Park; Es gibt zwei Parks. Do not switch to sind when more than one thing exists.']],headers:['Gender','Nominative','Accusative'],rows:[['Masculine','der / ein / kein','den / einen / keinen'],['Feminine','die / eine / keine','die / eine / keine'],['Neuter','das / ein / kein','das / ein / kein'],['Plural','die / — / keine','die / — / keine']],examples:[['Der Mann kauft einen Apfel.','The man buys an apple.','Der Mann is the subject. Einen Apfel is the thing bought.'],['Ich sehe die Frau und das Kind.','I see the woman and the child.','Both objects are accusative, but feminine die and neuter das do not change.']],mistake:['Ich habe ein Bruder.','Ich habe einen Bruder.','Bruder is masculine and the object of haben, so ein becomes einen.'],quiz:[['Ich brauche ___ Stift. (der Stift)',['ein','einen','einem'],1,'Brauchen takes a direct object; masculine accusative is einen.'],['___ Frau kauft den Kaffee.',['Der','Den','Die'],2,'Frau is the feminine subject, so use die.'],['Es gibt ___ Park.',['einen','ein','der'],0,'Es gibt is followed by the accusative.']]},
{title:'Possessives: mein, dein & more',tag:'Ownership',units:[3,8],intro:'Possessive words say who something belongs to. First choose the owner, then choose the ending for the thing owned.',steps:[['Choose the owner','Mein means my; dein is your (informal singular); sein means his or its; ihr means her or their. Unser means our; euer means your (informal plural); Ihr is formal your. The owner determines the beginning of the word.'],['Choose the ending from the noun','The noun that follows determines the ending. In the nominative: mein Vater, meine Mutter, mein Kind, meine Freunde. The same endings apply to dein, sein, ihr, unser, and Ihr.'],['Account for the case','A masculine direct object needs -en: Ich sehe meinen Vater. Feminine, neuter, and plural accusative forms remain meine Mutter, mein Kind, meine Freunde. This is the same pattern as ein/einen.'],['Watch euer and Ihr','When an ending is added to euer, the second e usually disappears: eure Mutter, euren Vater. Capitalize Ihr for formal your: Ist das Ihr Handy? Lowercase ihr can mean her or their; context identifies the owner.']],headers:['Owner','Masculine / neuter nominative','Feminine / plural nominative'],rows:[['ich','mein','meine'],['du','dein','deine'],['er / es','sein','seine'],['sie (she / they)','ihr','ihre'],['wir','unser','unsere'],['ihr (you all)','euer','eure'],['Sie (formal)','Ihr','Ihre']],examples:[['Anna besucht ihren Vater.','Anna visits her father.','Anna is the owner → ihr-. Vater is masculine accusative → ihren.'],['Das ist sein Auto.','That is his car.','Auto is neuter. The owner is male, so choose sein, not ihr.']],mistake:['Das ist mein Mutter.','Das ist meine Mutter.','Mutter is feminine, so the possessive needs -e in the nominative.'],quiz:[['Ich sehe ___ Bruder.',['mein','meine','meinen'],2,'Masculine accusative: meinen Bruder.'],['Wir besuchen ___ Mutter.',['unsere','unser','unseren'],0,'Mutter is feminine: unsere Mutter.'],['“Your mother” addressed to friends is…',['euer Mutter','eure Mutter','euren Mutter'],1,'Euer becomes eure before a feminine noun in nominative or accusative.']]},
{title:'Negation: nicht & kein',tag:'Saying no',units:[8,11],intro:'Both nicht and kein make statements negative, but they work in different places. Look at what you are negating before choosing.',steps:[['Use kein with an indefinite noun','Kein replaces ein/eine or negates a noun with no article: Das ist ein Auto → Das ist kein Auto. Ich habe Geld → Ich habe kein Geld. Use keine with plural nouns: Ich kaufe keine Schuhe.'],['Give kein the right ending','Kein behaves like ein in the singular. In masculine accusative it becomes keinen: Ich habe keinen Bruder. Feminine takes keine, neuter kein, and plural keine in nominative and accusative.'],['Use nicht for adjectives and specific phrases','Put nicht directly before an adjective or the particular phrase you deny: Das ist nicht teuer. Ich wohne nicht in Berlin. Ich komme nicht heute, sondern morgen. A noun with a definite article or possessive is normally negated with nicht: Das ist nicht mein Buch.'],['Negating the whole action','For many simple sentences, nicht comes near the end: Ich komme heute nicht. With an infinitive or participle at the end, nicht comes before it: Ich kann heute nicht kommen. Nicht placement depends on emphasis and sentence structure, so learn complete examples.']],headers:['Positive','Negative','Reason'],rows:[['Ich habe ein Auto.','Ich habe kein Auto.','Indefinite noun'],['Ich trinke Kaffee.','Ich trinke keinen Kaffee.','Noun without article; masculine object'],['Das ist teuer.','Das ist nicht teuer.','Adjective'],['Das ist mein Buch.','Das ist nicht mein Buch.','Possessive noun phrase'],['Ich kann kommen.','Ich kann nicht kommen.','Negated action']],examples:[['Ich habe keine Zeit.','I have no time.','Zeit is a feminine noun without an article, so use keine.'],['Die Schuhe sind nicht teuer.','The shoes are not expensive.','Nicht goes before the adjective teuer.']],mistake:['Ich habe nicht Auto.','Ich habe kein Auto.','An indefinite noun is normally negated with kein.'],quiz:[['Das ist ___ mein Handy.',['kein','nicht','keine'],1,'A phrase with mein is negated with nicht.'],['Ich möchte ___ Kaffee.',['keinen','nicht','keine'],0,'Kaffee is masculine accusative: keinen Kaffee.'],['Ich kann heute ___ kommen.',['kein','keinen','nicht'],2,'Negate the action with nicht before the final infinitive.']]},
{title:'Modal verbs & möchten',tag:'Ability, wishes & rules',units:[7,11,12,13],intro:'A modal verb changes the meaning of another verb: can go, must work, may come. Möchten is a polite form meaning would like.',steps:[['Build a sentence with two verbs','Conjugate the modal to match the subject and put the other verb at the end in the infinitive: Ich kann gut schwimmen. No zu is used between a modal and its infinitive. In a question: Kannst du gut schwimmen?'],['Choose the meaning','Können expresses ability or possibility; müssen necessity; dürfen permission; wollen intention; sollen an instruction, expectation, or advice from someone else. Mögen expresses liking, often with a noun: Ich mag Musik. Möchten is useful for polite requests: Ich möchte einen Tee.'],['Distinguish wishes from demands','Ich will can sound direct in a service encounter. Ich möchte or Ich hätte gern is often more polite when ordering. For an activity, keep the infinitive last: Ich möchte Deutsch lernen.'],['Be careful with negatives','Nicht müssen means you do not have to. Nicht dürfen means you are not allowed to. They are not interchangeable: Du musst nicht kommen leaves you a choice; Du darfst nicht kommen forbids coming.']],headers:['Subject','können / müssen','dürfen / wollen','sollen / möchten'],rows:[['ich','kann / muss','darf / will','soll / möchte'],['du','kannst / musst','darfst / willst','sollst / möchtest'],['er / sie / es','kann / muss','darf / will','soll / möchte'],['wir','können / müssen','dürfen / wollen','sollen / möchten'],['ihr','könnt / müsst','dürft / wollt','sollt / möchtet'],['sie / Sie','können / müssen','dürfen / wollen','sollen / möchten']],examples:[['Ich muss morgen früh arbeiten.','I have to work early tomorrow.','Muss is conjugated; arbeiten stays in its infinitive form at the end.'],['Du musst heute nicht arbeiten.','You do not have to work today.','There is no obligation. This does not mean working is forbidden.']],mistake:['Ich kann schwimme.','Ich kann schwimmen.','Only the modal is conjugated; the second verb is an infinitive.'],quiz:[['You are not allowed to smoke: Du ___ nicht rauchen.',['musst','darfst','willst'],1,'Nicht dürfen means not allowed to.'],['Wir ___ Deutsch lernen.',['möchte','möchtest','möchten'],2,'Wir takes möchten.'],['Which is correct?',['Ich muss heute arbeiten.','Ich muss arbeiten heute.','Ich müssen heute arbeite.'],0,'Conjugated modal second; infinitive last.']]},
{title:'Separable verbs & the sentence frame',tag:'Two-part verbs',units:[6,10,11,15],intro:'Some verbs have a prefix that separates in a main clause. Think of the conjugated verb and its prefix as the two ends of a sentence frame.',steps:[['Recognize separable prefixes','Common examples are aufstehen (get up), einkaufen (shop), anrufen (call), mitkommen (come along), and aussteigen (get off). Learn both the complete verb and a sentence that uses it. The prefix is usually stressed.'],['Split the verb in a simple main clause','Conjugate the main part, put it in the usual verb position, and move the prefix to the end: Ich rufe meine Mutter an. In a yes/no question the main part starts the sentence: Rufst du deine Mutter an?'],['Keep it together after a modal','When the verb is an infinitive after können, müssen, or another modal, keep the prefix attached: Ich muss früh aufstehen. The whole infinitive goes at the end.'],['Distinguish inseparable prefixes','Verbs beginning with be-, emp-, ent-, er-, ge-, miss-, ver-, and zer- are normally inseparable: besuchen → Ich besuche meine Mutter. Some prefixes have more than one behavior depending on the verb; learn the verb’s pattern rather than guessing.']],headers:['Infinitive','Main clause','After a modal'],rows:[['aufstehen','Ich stehe früh auf.','Ich muss früh aufstehen.'],['einkaufen','Wir kaufen heute ein.','Wir wollen heute einkaufen.'],['anrufen','Er ruft Mia an.','Er kann Mia anrufen.'],['mitkommen','Kommst du mit?','Willst du mitkommen?']],examples:[['Um sieben Uhr stehe ich auf.','I get up at seven.','The time expression starts the sentence; stehe is second; auf finishes it.'],['Ich möchte heute einkaufen.','I would like to go shopping today.','Einkaufen stays together because it is an infinitive after möchte.']],mistake:['Ich aufstehe um sieben Uhr.','Ich stehe um sieben Uhr auf.','In a simple main clause, auf separates and goes at the end.'],quiz:[['Ich rufe dich ___.',['ein','auf','an'],2,'The verb is anrufen: ich rufe … an.'],['Ich muss früh ___.',['aufstehen','stehe auf','aufstehe'],0,'After muss use the complete infinitive aufstehen.'],['Which verb stays together in “Ich ___ Mia”?',['anrufen','besuche','stehe auf'],1,'Besuchen has an inseparable be- prefix.']]},
{title:'Dative & everyday prepositions',tag:'Cases',units:[9,10,13],intro:'The dative is another grammatical case. At first, learn the common prepositions and verbs that require it, rather than trying to translate every English preposition literally.',steps:[['Use the dative after these prepositions','Mit (with/by), nach (to/after), aus (out of/from), zu (to), von (from/of), bei (at/near/with), and seit (since/for) take dative. The preposition determines the case even when the phrase involves travel: mit dem Bus, zu der Ärztin.'],['Change articles and pronouns','Masculine and neuter der/das become dem; feminine die becomes der; plural die becomes den. Personal pronouns change too: ich → mir, du → dir, er/es → ihm, sie → ihr, wir → uns, ihr → euch, sie → ihnen, Sie → Ihnen.'],['Add the plural n where possible','Dative plurals usually add -n if the plural does not already end in -n or -s: mit den Kindern, mit den Freunden. Do not add it to Autos: mit den Autos.'],['Learn dative verbs as phrases','Helfen and danken take a dative object: Ich helfe dir. Ich danke Ihnen. With geben, the recipient is often dative and the thing given accusative: Ich gebe dem Kind ein Buch.']],headers:['Gender','Definite article','Indefinite article','Example'],rows:[['Masculine','dem','einem','mit dem Bus'],['Feminine','der','einer','mit der Bahn'],['Neuter','dem','einem','mit dem Kind'],['Plural','den','—','mit den Kindern']],examples:[['Ich fahre mit dem Bus zur Arbeit.','I go to work by bus.','Mit takes dative. Zur is the contraction of zu der.'],['Können Sie mir helfen?','Can you help me?','Helfen takes the dative pronoun mir, not the accusative mich.']],mistake:['Mit den Bus.','Mit dem Bus.','Bus is singular masculine. Dative singular is dem; den is the plural dative article.'],quiz:[['Ich fahre mit ___ Bahn.',['die','der','dem'],1,'Bahn is feminine: dative der.'],['Kannst du ___ helfen? (to me)',['mich','ich','mir'],2,'Helfen takes dative: mir.'],['Mit den ___ . (children)',['Kindern','Kinder','Kindes'],0,'Kinder adds -n in the dative plural.']]},
{title:'Location, destination & movement',tag:'Places',units:[9,10],intro:'Some prepositions use either dative or accusative. The important distinction is a location versus a destination, not simply whether a person is moving.',steps:[['Ask Wo? for a location','With an, auf, hinter, in, neben, über, unter, vor, and zwischen, use dative to say where something is or where an activity happens: Ich bin in der Küche. Ich laufe im Park. Running is movement, but im Park describes its location.'],['Ask Wohin? for a destination','Use accusative with those same prepositions when the phrase describes a destination or change of position: Ich gehe in die Küche. Ich lege das Buch auf den Tisch. The person or object ends up somewhere new.'],['Learn contractions','In dem becomes im; in das becomes ins; an dem becomes am; an das becomes ans. These are common in everyday speech and writing: im Kino (at the cinema), ins Kino (to the cinema).'],['Choose zu, nach, or in for travel','Nach is used for cities and most countries with no article: nach Berlin, nach Deutschland. Zu is common with people and destinations such as zum Arzt, zur Bank. Countries with an article commonly use in + accusative: in die Schweiz. Learn nach Hause (homeward) and zu Hause (at home) as set phrases.']],headers:['Location: where?','Destination: where to?'],rows:[['in der Küche','in die Küche'],['auf dem Tisch','auf den Tisch'],['im Kino (in dem)','ins Kino (in das)'],['an der Wand','an die Wand'],['zu Hause','nach Hause']],examples:[['Das Buch liegt auf dem Tisch.','The book is lying on the table.','A fixed location: auf + dative.'],['Ich lege das Buch auf den Tisch.','I put the book on the table.','A destination for the book: auf + accusative.'],['Ich laufe im Park.','I run in the park.','Movement alone does not force accusative; the park is the location of the running.']],mistake:['Ich bin in die Küche.','Ich bin in der Küche.','Bin describes a location, so in takes dative here.'],quiz:[['I am at the cinema: Ich bin ___.',['ins Kino','im Kino','in das Kino'],1,'Im Kino describes a location.'],['I put the book on the table: auf ___ Tisch.',['den','dem','der'],0,'The table is the book’s destination: accusative den.'],['I travel to Switzerland: Ich fahre ___.',['nach Schweiz','in der Schweiz','in die Schweiz'],2,'Die Schweiz has an article; use in + accusative for the destination.']]},
{title:'Time, dates & frequency',tag:'When & how often',units:[6,14],intro:'Learn time expressions as small chunks. They help you talk about routines and plans without translating each preposition separately.',steps:[['Use um, am, and im','Use um with a clock time: um acht Uhr. Use am for weekdays, dates, and many parts of the day: am Montag, am dritten Mai, am Abend. Use im for months and seasons: im Mai, im Sommer. A common exception is in der Nacht (at night).'],['Read informal clock times carefully','Halb drei means half an hour before three: 2:30. Viertel nach zwei is 2:15; Viertel vor drei is 2:45. Regional quarter-hour expressions vary. The 24-hour form is useful for tickets and appointments: vierzehn Uhr dreißig.'],['Make dates ordinal','Dates use ordinal numbers: am ersten, am zweiten, am dritten, am vierten. One, three, seven, and eight have forms worth learning: ersten, dritten, siebten, achten. From 20 onward, use -sten: am zwanzigsten, am einundzwanzigsten.'],['Describe routines and duration','Jeden Tag means every day; montags means on Mondays. Common frequency words are immer, oft, manchmal, selten, nie. Say seit einem Jahr for an ongoing situation that began a year ago: Ich wohne seit einem Jahr hier. German normally uses the present tense for this ongoing meaning.']],headers:['Expression','Example','Meaning'],rows:[['um + time','um neun Uhr','at nine o’clock'],['am + day/date','am Montag / am ersten Mai','on Monday / on May 1'],['im + month/season','im Juni / im Winter','in June / in winter'],['von … bis …','von neun bis fünf','from nine to five'],['jeden + day/week etc.','jeden Tag','every day'],['seit + dative','seit einem Jahr','for a year, continuing now']],examples:[['Der Kurs beginnt um halb acht.','The course starts at 7:30.','Halb points toward the coming hour: eight.'],['Am ersten Mai arbeite ich nicht.','I do not work on May 1.','Am ersten Mai is one element before the conjugated verb arbeite.']],mistake:['Im Montag um acht Uhr.','Am Montag um acht Uhr.','Weekdays take am; clock times take um.'],quiz:[['Halb sechs means…',['6:30','5:30','6:15'],1,'It is halfway to six: 5:30.'],['___ Winter ist es kalt.',['Am','Um','Im'],2,'Seasons take im.'],['On May 3 is…',['am dritten Mai','am drei Mai','im dritten Mai'],0,'Dates use ordinal forms: am dritten Mai.']]},
{title:'Commands & polite requests',tag:'Everyday interaction',units:[10,12,13],intro:'The imperative tells someone to do something. In everyday situations, bitte and a friendly tone help; a question with können is often a softer request.',steps:[['Use the formal Sie pattern','Put the verb first and Sie second: Öffnen Sie das Buch. Kommen Sie bitte mit. The formal imperative normally looks like the infinitive plus Sie. Sein is exceptional: Seien Sie bitte ruhig.'],['Use the informal du form','The du imperative usually uses the stem without du: kommen → Komm!, machen → Mach! A final -e is sometimes optional, but needed for comfortable pronunciation in forms like Arbeite! Separable prefixes stay at the end: Ruf mich an!'],['Use the ihr form for a group','Take the normal ihr present-tense verb and remove ihr: ihr kommt → Kommt!; ihr lest → Lest!; ihr seid → Seid! Say Kommt bitte mit to several friends.'],['Learn irregular forms and negatives','Common du forms include lies (lesen), nimm (nehmen), iss (essen), and sei (sein). Vowel changes from a to ä do not appear in the imperative: fahren → Fahr! To say not to do something, use nicht: Komm bitte nicht zu spät.']],headers:['Infinitive','du','ihr','Sie'],rows:[['kommen','Komm!','Kommt!','Kommen Sie!'],['lesen','Lies!','Lest!','Lesen Sie!'],['nehmen','Nimm!','Nehmt!','Nehmen Sie!'],['sein','Sei!','Seid!','Seien Sie!']],examples:[['Können Sie das bitte wiederholen?','Could you please repeat that?','A polite question often sounds softer than a direct command.'],['Steh bitte um sieben Uhr auf.','Please get up at seven.','Aufstehen separates in the imperative too.']],mistake:['Lese das Buch! (to one friend)','Lies das Buch!','Lesen has an irregular du imperative: lies.'],quiz:[['Ask several friends to come:',['Komm bitte!','Kommt bitte!','Kommen bitte!'],1,'The informal plural imperative is kommt.'],['Formal command using sein:',['Sind Sie ruhig!','Sein Sie ruhig!','Seien Sie ruhig!'],2,'Sein has the special formal imperative seien Sie.'],['A polite request to repeat something is…',['Können Sie das bitte wiederholen?','Sie wiederholt das?','Wiederholen du!'],0,'Können Sie … bitte …? is a standard polite request.']]},
{title:'Talking about the past',tag:'Perfekt, war & hatte',units:[15],intro:'Everyday spoken German often uses the Perfekt for completed actions. It has two parts: an auxiliary verb in the present and a past participle.',steps:[['Build the two-part sentence','Conjugate haben or sein and put the participle at the end: Ich habe gestern gekocht. In a question, move the auxiliary: Hast du gestern gekocht? Other information fits between the auxiliary and the participle.'],['Form or learn the participle','Regular verbs often form ge- + stem + -t: machen → gemacht. A stem ending in -t/-d commonly adds -et: arbeiten → gearbeitet. Many common verbs are irregular: trinken → getrunken, lesen → gelesen, schreiben → geschrieben. Learn these as verb pairs.'],['Watch prefixes and -ieren','Separable verbs put ge between the prefix and stem: einkaufen → eingekauft. Inseparable prefixes do not take ge: besuchen → besucht. Verbs ending in -ieren also skip ge: studieren → studiert.'],['Choose haben or sein','Most verbs use haben. Many verbs describing movement from place to place or a change of state use sein: gehen → ist gegangen; fahren → ist gefahren; aufstehen → ist aufgestanden. Sein and bleiben also use sein. Learn the auxiliary with each verb; not every active or moving action takes sein.'],['Use war and hatte in common situations','Sein and haben are often used in the simple past: ich war, du warst, er war, wir waren, ihr wart, sie waren; ich hatte, du hattest, er hatte, wir hatten, ihr hattet, sie hatten. These are natural for descriptions and possession in the past.']],headers:['Infinitive','Perfekt with ich','Meaning'],rows:[['machen','habe gemacht','did / made'],['essen','habe gegessen','ate'],['einkaufen','habe eingekauft','shopped'],['besuchen','habe besucht','visited'],['gehen','bin gegangen','went'],['fahren','bin gefahren','traveled / drove'],['bleiben','bin geblieben','stayed']],examples:[['Gestern habe ich meine Mutter besucht.','Yesterday I visited my mother.','Besuchen has be-, so the participle is besucht without ge-.'],['Wir sind nach Berlin gefahren.','We traveled to Berlin.','Fahren describes travel to a destination here, so use sein.'],['Ich war müde und hatte keine Zeit.','I was tired and had no time.','War and hatte are simple past forms.']],mistake:['Ich habe nach Hause gegangen.','Ich bin nach Hause gegangen.','Gehen uses sein in the Perfekt: bin gegangen.'],quiz:[['Wir haben gestern ___. (work)',['gearbeitet','gearbeiten','gearbeit'],0,'Arbeiten takes the participle gearbeitet.'],['Ich ___ zu Hause geblieben.',['habe','bin','hat'],1,'Bleiben uses sein.'],['Er hat seine Mutter ___.',['gebesucht','besuchen','besucht'],2,'The inseparable prefix be- blocks ge-.']]},
{title:'Connecting ideas & describing things',tag:'Longer sentences',units:[8,11,16],intro:'You can say much more using a few connecting words and simple descriptions. Build two correct short sentences before joining them.',steps:[['Join main clauses with und, aber, oder, denn','These words do not send the verb to the end. Ich lerne Deutsch, denn ich wohne in Berlin. Each full clause keeps its normal verb-second structure. Use und for addition, aber for contrast, oder for alternatives, and denn for a reason.'],['Use adjectives after sein','After sein, adjectives keep their dictionary form: Der Kaffee ist heiß. Die Getränke sind heiß. The adjective does not change for gender or number in this position. This is a simple way to describe things at A1.'],['Recognize adjectives before nouns','Before a noun, an adjective normally needs an ending: ein kleiner Tisch, eine kleine Wohnung, ein kleines Zimmer. Accusative masculine changes both words: einen kleinen Tisch. At first, learn these useful patterns; the full system has more endings, especially after definite articles and in other cases.'],['Say what you like and prefer','Use gern with a verb: Ich koche gern. Use lieber for a preference: Ich trinke lieber Tee. Use mögen with a noun: Ich mag Tee. For familiar comparisons, learn gut → besser → am besten and gern → lieber → am liebsten as common forms.']],headers:['Connector','Use','Example'],rows:[['und','Add information','Ich lese und ich höre Musik.'],['aber','Contrast','Ich möchte kommen, aber ich muss arbeiten.'],['oder','Give alternatives','Möchtest du Tee oder Kaffee?'],['denn','Give a reason','Ich bleibe zu Hause, denn ich bin krank.']],examples:[['Die Wohnung ist klein, aber sie ist hell.','The apartment is small, but it is bright.','Klein and hell have no endings after ist. Each clause keeps verb-second order.'],['Ich habe ein kleines Zimmer.','I have a small room.','Zimmer is neuter. After ein, the adjective is kleines.']],mistake:['Ich komme nicht, denn ich krank bin.','Ich komme nicht, denn ich bin krank.','Denn keeps normal main-clause word order. The verb does not go to the end.'],quiz:[['Die Schuhe sind ___.',['blaue','blau','blauen'],1,'An adjective after sein has no ending.'],['Ich habe ein ___ Zimmer.',['kleine','kleinen','kleines'],2,'Neuter ein + adjective + noun: ein kleines Zimmer.'],['Choose the correct sentence.',['Ich bin müde, aber ich komme.','Ich bin müde, aber ich kommen.','Ich bin müde, aber ich am komme.'],0,'Aber connects two ordinary main clauses.']]}
];

</script><script>const app=document.querySelector('#app');
let grammarIndex=0, grammarAnswers={}, current=0, section='learn', view='course', card=0, flipped=false, category=-1, answers={}, completed=new Set();

splay:flex;gap:14px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:13px 8px;font-size:14px;line-height:1.4}.unit b{font-size:12px;font-weight:400;color:var(--muted);min-width:23px}.unit.selected{background:var(--ink);color:white}.unit.selected b{color:var(--accent)}.unit small{margin-left:auto}.lesson{background:var(--white);border:1px solid var(--line);padding:36px}.lesson-top{display:flex;justify-content:space-between;align-items:start;gap:12px}.lesson h2{font-size:42px;margin-bottom:12px}.subtle{color:var(--muted)}.pill{border:1px solid var(--line);border-radius:22px;padding:4px 12px;white-space:nowrap;font-size:12px}.tabs{display:flex;flex-wrap:wrap;gap:20px;border-bottom:1px solid var(--line);margin:22px 0 26px}.tabs button{border:0;border-bottom:3px solid transparent;background:none;padding:10px 0;font-size:14px}.tabs .selected{border-color:var(--ink);font-weight:700}.example{padding:20px 24px;margin:20px 0;background:#edf0e5;border-left:3px solid var(--ink)}.example strong{font-size:22px;font-weight:500}.example p{margin:4px 0 0}.primary,.secondary{border:1px solid var(--ink);padding:12px 20px;border-radius:3px;background:var(--ink);color:white;font-size:14px;font-weight:600}.secondary{background:transparent;color:var(--ink)}.audio{border:1px solid var(--line);background:transparent;border-radius:50%;width:40px;height:40px;font-size:18px;flex-shrink:0}.bottom{border-top:1px solid var(--line);padding-top:24px;margin-top:30px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.word{padding:18px;border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.word strong{display:block;font-size:18px}.word small{display:block;color:var(--muted);font-size:14px}.question{margin:24px 0}.options{display:grid;gap:8px}.option{text-align:left;background:transparent;border:1px solid var(--line);padding:12px 16px;border-radius:3px}.option:hover{border-color:var(--ink)}.option.correct{background:#dcebcf;border-color:#4c7136}.option.incorrect{background:#f7ded3;border-color:#a24928}.feedback{margin-top:12px;font-size:14px}.feedback:empty{display:none}details{border:1px solid var(--line);padding:15px;margin-top:16px}summary{cursor:pointer;font-size:14px;font-weight:600}textarea{width:100%;min-height:110px;background:var(--paper);padding:16px;border:1px solid var(--line);border-radius:3px;color:var(--ink);resize:vertical}label{display:block;margin:14px 0 8px}.dialogue{border-bottom:1px solid var(--line);padding:16px 0}.dialogue p{margin:3px 0}.flashcard{min-height:280px;background:var(--ink);color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;width:100%;border:0}.flashcard strong{font:42px Georgia,serif}.flashcard small{margin-top:22px;color:#d5ddc9}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:22px 0}select,input{padding:12px;border:1px solid var(--line);background:var(--white);color:var(--ink);max-width:100%}.progress{height:5px;background:var(--line);margin-top:20px}.progress span{display:block;background:var(--ink);height:100%}.notice{font-size:13px;color:var(--muted);margin-top:18px}.review-card{background:var(--white);padding:30px;border:1px solid var(--line)}footer{border-top:1px solid var(--line);margin:0 5%;padding:25px 0;display:flex;gap:20px;justify-content:space-between;font-size:12px;color:var(--muted)}footer b{font:24px Georgia,serif;color:var(--ink)}@media(max-width:850px){header{flex-wrap:wrap}.level{display:none}.intro{grid-template-columns:1fr 0.65fr;gap:20px}.workspace{grid-template-columns:210px minmax(0,1fr);gap:18px}.lesson{padding:24px}.grid{grid-template-columns:1fr}.stamp{padding:20px}.stamp strong{font-size:44px}}@media(max-width:620px){header{padding:20px;gap:20px}nav{width:100%;justify-content:space-between;gap:0}main{padding:30px 20px}.intro{grid-template-columns:1fr}.stamp{transform:none}.stamp strong{font-size:34px}.stamp{padding:18px 24px}.workspace{display:block}.syllabus{max-height:205px;overflow:auto;margin-bottom:24px}.syllabus h3{position:sticky;top:0;background:var(--paper);margin:0;padding:10px 0}.lesson{padding:22px}.lesson h2{font-size:34px}.lesson-top{display:block}.pill{display:inline-block;margin:6px 0}.tabs{gap:15px}footer{flex-wrap:wrap}.row{flex-wrap:wrap}.flashcard strong{font-size:32px}}

{title:'Hallo, Deutsch!',goal:'Greet someone and introduce yourself.',grammar:'Use du with friends, children, and people who invite you to be informal. Use Sie with adults in formal situations; always capitalize Sie. The verb changes with the person: ich bin, du bist, er/sie/es ist, wir sind, ihr seid, sie/Sie sind. With heißen: ich heiße, du heißt, er/sie heißt.',example:['Hallo! Ich heiße Alex. Wie heißen Sie?','Hello! My name is Alex. What is your name? (formal)'],words:[['Hallo','hello'],['Guten Morgen','good morning'],['Guten Tag','hello / good day'],['Guten Abend','good evening'],['Auf Wiedersehen','goodbye (formal)'],['Tschüss','bye'],['bitte','please / you’re welcome'],['danke','thank you'],['Entschuldigung','excuse me / sorry'],['ja / nein','yes / no']],dialogue:[['Hallo! Wie heißt du?','Hello! What is your name?'],['Ich heiße Mia. Und du?','My name is Mia. And you?'],['Ich bin Ben. Freut mich!','I’m Ben. Nice to meet you!']],quiz:[['Ich ___ Mia.',['bin','bist','sind'],0,'Ich takes bin.'],['Which is the formal question?',['Wie heißt du?','Wie heißen Sie?','Wie geht’s?'],1,'Sie is the formal form of you.']],speak:'Greet a new classmate, say your name, and ask their name.',write:'Write two sentences introducing yourself.',sample:'Hallo! Ich heiße Alex. Ich bin neu hier.'},
{title:'Sounds & spelling',goal:'Read common letter combinations and spell your name.',grammar:'German vowels can be long or short. The combination ie usually sounds like the vowel in “see”; ei like “eye”; eu and äu like “oy.” Sch sounds like “sh”; z like “ts”; w like English “v”; j like English “y.” ß sounds like “s.” For ü, shape your lips for “oo” while saying “ee”; for ö, round your lips while saying “eh.” Ch is softer after i/e and further back after a/o/u. Listen and imitate rather than relying only on English approximations.',example:['Wie schreibt man das? A–L–E–X.','How do you spell that? A–L–E–X.'],words:[['eins','one · ei'],['sieben','seven · ie'],['neun','nine · eu'],['schön','beautiful · sch / ö'],['fünf','five · ü'],['Straße','street · ß'],['Wasser','water · w'],['Zeit','time · z'],['ich','I · soft ch'],['Buch','book · back ch']],dialogue:[['Wie ist Ihr Name?','What is your name?'],['Mein Name ist Müller.','My name is Müller.'],['Wie schreibt man das?','How do you spell that?'],['M–Ü–L–L–E–R.','M–Ü–L–L–E–R.']],quiz:[['Which word contains the “eye” sound?',['sieben','eins','neun'],1,'Ei in eins sounds approximately like “eye.”'],['German w usually sounds like English…',['w','v','j'],1,'For example, Wasser starts with a v sound.']],speak:'Spell your name aloud. Say fünf, schön, ich, and Buch slowly.',write:'Write a polite request to repeat something.',sample:'Können Sie das bitte wiederholen?'},
{title:'You & your world',goal:'Share your age, home, country, and language.',grammar:'For regular verbs remove -en and add: ich -e, du -st, er/sie/es -t, wir -en, ihr -t, sie/Sie -en. Example: wohnen → ich wohne, du wohnst. Sprechen changes its vowel: du sprichst, er spricht. A question word comes first, then the verb: Wo wohnst du? Most countries take no article: aus Deutschland. Some do: aus der Schweiz, aus der Türkei. Numbers 21–99 say the unit before the tens: einundzwanzig = 21.',example:['Ich komme aus Kanada und wohne in Berlin. Ich bin 25 Jahre alt.','I come from Canada and live in Berlin. I am 25 years old.'],words:[['null, eins, zwei, drei','0, 1, 2, 3'],['vier, fünf, sechs','4, 5, 6'],['sieben, acht, neun, zehn','7, 8, 9, 10'],['elf, zwölf','11, 12'],['dreizehn, vierzehn, fünfzehn','13, 14, 15'],['sechzehn, siebzehn','16, 17'],['achtzehn, neunzehn, zwanzig','18, 19, 20'],['dreißig, vierzig, fünfzig','30, 40, 50'],['sechzig, siebzig, achtzig, neunzig','60, 70, 80, 90'],['hundert','100'],['wo / woher / wie','where / where from / how'],['Deutsch / Englisch','German / English']],dialogue:[['Woher kommst du?','Where are you from?'],['Ich komme aus Kanada.','I come from Canada.'],['Welche Sprachen sprichst du?','Which languages do you speak?'],['Ich spreche Englisch und ein bisschen Deutsch.','I speak English and a little German.']],quiz:[['What is einundzwanzig?',['12','21','31'],1,'Ein + und + zwanzig = one and twenty.'],['Wo ___ du?',['wohne','wohnt','wohnst'],2,'Du takes the ending -st.']],speak:'Say your phone number one digit at a time, then your age.',write:'Introduce your country, city, and languages.',sample:'Ich komme aus Kanada. Ich wohne in Toronto. Ich spreche Englisch und ein bisschen Deutsch.'},
{title:'Family & friends',goal:'Introduce the people in your life.',grammar:'Personal pronouns: ich (I), du (you), er (he), sie (she), es (it), wir (we), ihr (you plural), sie (they), Sie (formal you). Possessives agree with the noun: mein Vater, meine Mutter, mein Kind, meine Eltern. The same pattern works for dein (your), sein (his/its), ihr (her/their), unser (our), euer (your plural), Ihr (formal your). For feminine/plural euer becomes eure.',example:['Das ist meine Schwester. Sie heißt Lea.','This is my sister. Her name is Lea.'],words:[['die Mutter · Mütter','mother'],['der Vater · Väter','father'],['die Eltern (plural)','parents'],['die Schwester · Schwestern','sister'],['der Bruder · Brüder','brother'],['das Kind · Kinder','child'],['die Frau · Frauen','woman / wife'],['der Mann · Männer','man / husband'],['der Freund · Freunde','friend (male) / boyfriend'],['die Freundin · Freundinnen','friend (female) / girlfriend']],dialogue:[['Ist das dein Bruder?','Is that your brother?'],['Ja, das ist mein Bruder Max.','Yes, that is my brother Max.'],['Wie alt ist er?','How old is he?'],['Er ist acht Jahre alt.','He is eight years old.']],quiz:[['Das ist ___ Mutter.',['mein','meine','meinen'],1,'Mutter is feminine: meine Mutter.'],['“We” in German is…',['ihr','sie','wir'],2,'Wir means we.']],speak:'Introduce two real or imaginary family members.',write:'Write three sentences about a friend.',sample:'Das ist meine Freundin Anna. Sie wohnt in Bonn. Sie spricht Deutsch.'},
{title:'Things around you',goal:'Use articles and learn nouns with their plurals.',grammar:'All German nouns begin with a capital letter. Learn each noun with its article and plural: der Tisch, die Tische. Der is masculine, die feminine, das neuter; all plural nouns use die. An indefinite article means a/an: ein Tisch, eine Lampe, ein Buch. There is no plural indefinite article: Bücher. Grammatical gender does not reliably follow meaning, so memorize it with each noun.',example:['Das ist ein Buch. Die Bücher sind interessant.','That is a book. The books are interesting.'],words:[['der Tisch · Tische','table'],['der Stuhl · Stühle','chair'],['das Buch · Bücher','book'],['die Tasche · Taschen','bag'],['der Schlüssel · Schlüssel','key'],['das Handy · Handys','mobile phone'],['die Lampe · Lampen','lamp'],['der Stift · Stifte','pen'],['das Fenster · Fenster','window'],['die Tür · Türen','door']],dialogue:[['Was ist das auf Deutsch?','What is that in German?'],['Das ist ein Schlüssel.','That is a key.'],['Und das?','And that?'],['Das sind Bücher.','Those are books.']],quiz:[['Which is correct?',['eine Buch','ein Buch','einen Buch'],1,'Buch is neuter: das Buch / ein Buch.'],['The definite article for all plural nouns is…',['der','das','die'],2,'Die Bücher, die Tische, die Lampen.']],speak:'Name five things in your room with their articles.',write:'Describe three objects using Das ist …',sample:'Das ist ein Tisch. Das ist eine Lampe. Das ist ein Buch.'},
{title:'Everyday routines',goal:'Build statements and questions in the present tense.',grammar:'In a main statement, the conjugated verb is the second sentence element: Ich lerne heute Deutsch. Heute lerne ich Deutsch. A yes/no question starts with the verb: Lernst du Deutsch? Add -e- for pronunciation with verbs like arbeiten: du arbeitest, er arbeitet. Common changes: lesen → du liest, er liest; fahren → du fährst, er fährt. Haben: ich habe, du hast, er hat, wir haben, ihr habt, sie haben.',example:['Heute arbeite ich zu Hause. Lernst du Deutsch?','Today I work at home. Are you learning German?'],words:[['lernen','to learn'],['arbeiten','to work'],['lesen','to read'],['schreiben','to write'],['machen','to do / make'],['gehen','to go'],['fahren','to travel / drive'],['haben','to have'],['heute','today'],['jeden Tag','every day']],dialogue:[['Was machst du heute?','What are you doing today?'],['Ich arbeite und lerne Deutsch.','I work and learn German.'],['Liest du auch?','Do you also read?'],['Ja, ich lese ein Buch.','Yes, I read a book.']],quiz:[['Which sentence is correct?',['Heute ich lerne Deutsch.','Heute lerne ich Deutsch.','Heute Deutsch ich lerne.'],1,'The conjugated verb lerne is the second element.'],['___ du ein Auto?',['Haben','Hat','Hast'],2,'Du hast becomes Hast du …? in a question.']],speak:'Say three things you do every day.',write:'Describe your day in three sentences, starting one with Heute.',sample:'Ich arbeite jeden Tag. Heute lerne ich Deutsch. Am Abend lese ich ein Buch.'},
{title:'Time & plans',goal:'Tell the time and arrange a meeting.',grammar:'Use um with clock times, am with days/dates, im with months/seasons: um neun Uhr, am Montag, im Mai. Halb drei means 2:30—halfway to three. Viertel nach zwei = 2:15; Viertel vor drei = 2:45. Separable verbs split in a main clause: Ich stehe um sieben Uhr auf. Dates use ordinal numbers: am ersten Mai, am dritten Juni; from 20 onward the ordinal usually ends in -sten.',example:['Am Montag stehe ich um sieben Uhr auf.','On Monday I get up at seven o’clock.'],words:[['Montag, Dienstag, Mittwoch','Monday, Tuesday, Wednesday'],['Donnerstag, Freitag','Thursday, Friday'],['Samstag, Sonntag','Saturday, Sunday'],['Januar, Februar, März','January, February, March'],['April, Mai, Juni','April, May, June'],['Juli, August, September','July, August, September'],['Oktober, November, Dezember','October, November, December'],['aufstehen','to get up'],['anfangen','to begin'],['der Termin · Termine','appointment']],dialogue:[['Wann treffen wir uns?','When shall we meet?'],['Am Dienstag um halb drei.','On Tuesday at half past two.'],['Also um vierzehn Uhr dreißig?','So at fourteen thirty?'],['Ja, genau!','Yes, exactly!']],quiz:[['Halb acht means…',['7:30','8:30','8:00'],0,'Halb points to the coming hour: half to eight.'],['Ich stehe um sechs Uhr ___.',['an','auf','aus'],1,'Aufstehen splits: ich stehe … auf.']],speak:'Say today’s date and three appointment times.',write:'Suggest a meeting day and time.',sample:'Hast du am Freitag Zeit? Wir treffen uns um fünfzehn Uhr im Café.'},
{title:'At the café',goal:'Order food and drinks politely.',grammar:'The direct object usually takes the accusative. Masculine articles change: der → den, ein → einen. Feminine, neuter, and plural articles stay the same as in the nominative. Ich möchte einen Kaffee. Möchten is a polite “would like”: ich möchte, du möchtest, er möchte, wir möchten, ihr möchtet, Sie möchten. Nehmen changes to du nimmst, er nimmt.',example:['Ich möchte einen Kaffee und ein Wasser, bitte.','I would like a coffee and a water, please.'],words:[['der Kaffee · Kaffees','coffee'],['der Tee · Tees','tea'],['das Wasser (usually singular)','water'],['das Brot · Brote','bread'],['das Brötchen · Brötchen','bread roll'],['der Käse (usually singular)','cheese'],['die Milch (usually singular)','milk'],['der Apfel · Äpfel','apple'],['die Rechnung · Rechnungen','bill'],['bezahlen','to pay']],dialogue:[['Was möchten Sie?','What would you like?'],['Einen Tee und ein Brötchen, bitte.','A tea and a bread roll, please.'],['Sonst noch etwas?','Anything else?'],['Nein, danke. Die Rechnung, bitte.','No, thank you. The bill, please.']],quiz:[['Ich möchte ___ Kaffee.',['ein','einen','eine'],1,'Kaffee is masculine and the direct object: einen Kaffee.'],['“The bill, please” is…',['Die Rechnung, bitte.','Guten Appetit!','Wie bitte?'],0,'Use Die Rechnung, bitte to request the bill.']],speak:'Order two drinks and something to eat.',write:'Write your breakfast order.',sample:'Ich möchte einen Tee, ein Brötchen und einen Apfel, bitte.'},
{title:'Shopping & prices',goal:'Ask about prices and say what you need.',grammar:'Use kein to negate a noun with ein or no article: Ich habe kein Auto. Ich kaufe keine Schuhe. In the masculine accusative use keinen: Ich brauche keinen Mantel. Use nicht for verbs, adjectives, and other phrases: Das ist nicht teuer. Ich komme heute nicht. Prices: drei Euro fünfzig = €3.50. Adjectives after sein do not take an ending: Die Schuhe sind blau.',example:['Was kostet die Jacke? Sie kostet vierzig Euro.','How much does the jacket cost? It costs forty euros.'],words:[['die Jacke · Jacken','jacket'],['die Hose · Hosen','trousers'],['der Schuh · Schuhe','shoe'],['das Hemd · Hemden','shirt'],['die Größe · Größen','size'],['rot / blau / grün','red / blue / green'],['schwarz / weiß / gelb','black / white / yellow'],['teuer / billig','expensive / cheap'],['groß / klein','big / small'],['kaufen / kosten','to buy / to cost']],dialogue:[['Haben Sie die Jacke in Größe M?','Do you have the jacket in size M?'],['Ja. Die Jacke kostet fünfzig Euro.','Yes. The jacket costs fifty euros.'],['Kann ich mit Karte bezahlen?','Can I pay by card?'],['Ja, natürlich.','Yes, of course.']],quiz:[['Das ist ___ teuer.',['kein','nicht','keine'],1,'Nicht negates the adjective teuer.'],['Ich habe ___ Auto.',['keinen','keine','kein'],2,'Auto is neuter: kein Auto.']],speak:'Ask for an item, its size, and its price.',write:'Describe a clothing item and its price.',sample:'Die Jacke ist blau. Sie kostet fünfzig Euro. Sie ist nicht billig.'},
{title:'At home',goal:'Describe your home and say where things are.',grammar:'Es gibt means “there is / there are” and takes the accusative: Es gibt einen Balkon. To state location, in/auf/unter/neben/vor/hinter/über/zwischen/an take the dative: auf dem Tisch, in der Küche. Dative articles: der/das → dem, die → der, plural die → den (usually add -n to the noun if possible). Compare location Wo? with destination Wohin?: Ich bin in der Küche; ich gehe in die Küche.',example:['Die Lampe steht auf dem Tisch. Es gibt einen Balkon.','The lamp is on the table. There is a balcony.'],words:[['die Wohnung · Wohnungen','apartment'],['das Zimmer · Zimmer','room'],['die Küche · Küchen','kitchen'],['das Bad · Bäder','bathroom'],['das Schlafzimmer · Schlafzimmer','bedroom'],['das Bett · Betten','bed'],['der Schrank · Schränke','cupboard / wardrobe'],['der Balkon · Balkone','balcony'],['die Miete · Mieten','rent'],['hell / ruhig','bright / quiet']],dialogue:[['Wie ist deine Wohnung?','What is your apartment like?'],['Sie ist klein, aber hell.','It is small but bright.'],['Gibt es einen Balkon?','Is there a balcony?'],['Ja, neben dem Wohnzimmer.','Yes, next to the living room.']],quiz:[['Es gibt ___ Balkon.',['ein','einen','einem'],1,'Es gibt takes the accusative: einen Balkon.'],['The fixed location “in the kitchen” is…',['in der Küche','in die Küche','in dem Küche'],0,'Küche is feminine. Static location uses dative: der Küche.']],speak:'Describe your room and the position of three objects.',write:'Write a short apartment description.',sample:'Meine Wohnung hat zwei Zimmer. Die Küche ist klein. Es gibt einen Balkon.'},
{title:'Around town',goal:'Find your way and use public transport.',grammar:'Use nach for cities and most countries without articles: nach Berlin, nach Deutschland. Use zu for many destinations involving people/buildings: zum Arzt, zur Bank. Zum = zu dem; zur = zu der. Mit takes the dative: mit dem Bus, mit der Bahn. Useful fixed expressions: nach Hause (homeward), zu Hause (at home), am Bahnhof (at the station). Polite directions often use Sie: Gehen Sie geradeaus.',example:['Ich fahre mit dem Bus zum Bahnhof.','I’m going to the station by bus.'],words:[['der Bahnhof · Bahnhöfe','train station'],['die Haltestelle · Haltestellen','stop'],['der Bus · Busse','bus'],['der Zug · Züge','train'],['die Fahrkarte · Fahrkarten','ticket'],['die Bank · Banken','bank'],['die Apotheke · Apotheken','pharmacy'],['links / rechts','left / right'],['geradeaus','straight ahead'],['einsteigen / aussteigen','to board / get off']],dialogue:[['Entschuldigung, wo ist der Bahnhof?','Excuse me, where is the train station?'],['Gehen Sie geradeaus und dann links.','Go straight ahead and then left.'],['Ist das weit?','Is it far?'],['Nein, fünf Minuten zu Fuß.','No, five minutes on foot.']],quiz:[['Ich fahre ___ Berlin.',['zu','nach','bei'],1,'Cities take nach when describing travel to them.'],['Mit ___ Bus.',['den','der','dem'],2,'Mit takes dative: dem Bus.']],speak:'Give directions from your home to a nearby place.',write:'Ask for a ticket to Berlin.',sample:'Guten Tag! Ich möchte eine Fahrkarte nach Berlin, bitte. Wann fährt der Zug?'},
{title:'Free time',goal:'Talk about hobbies and make plans.',grammar:'Gern after a verb means you like doing it: Ich schwimme gern. Lieber expresses a preference: Ich lese lieber. Modal verbs send the other verb to the end in its infinitive form: Ich kann gut schwimmen. Können: kann, kannst, kann, können, könnt, können. Wollen: will, willst, will, wollen, wollt, wollen. Negate ability with nicht: Ich kann nicht kommen.',example:['Am Samstag will ich Fußball spielen. Kommst du mit?','On Saturday I want to play football. Are you coming along?'],words:[['schwimmen','to swim'],['tanzen','to dance'],['kochen','to cook'],['Musik hören','to listen to music'],['Fußball spielen','to play football'],['spazieren gehen','to go for a walk'],['das Kino · Kinos','cinema'],['das Wochenende · Wochenenden','weekend'],['gern / lieber','gladly / preferably'],['Zeit haben','to have time']],dialogue:[['Was machst du gern?','What do you like doing?'],['Ich schwimme gern. Und du?','I like swimming. And you?'],['Ich gehe gern ins Kino. Hast du morgen Zeit?','I like going to the cinema. Do you have time tomorrow?'],['Ja, gern!','Yes, I’d love to!']],quiz:[['Ich kann gut ___.',['schwimme','schwimmen','schwimmt'],1,'The second verb stays in its infinitive form after können.'],['Ich lese gern means…',['I must read.','I like reading.','I cannot read.'],1,'Gern expresses enjoyment of an activity.']],speak:'Name two hobbies you like and one you don’t like.',write:'Invite a friend to an activity.',sample:'Hallo Mia! Hast du am Samstag Zeit? Ich möchte ins Kino gehen. Kommst du mit?'},
{title:'Work & study',goal:'Understand simple requests, rules, and schedules.',grammar:'Müssen expresses necessity: ich muss, du musst, er muss, wir müssen, ihr müsst, sie müssen. Dürfen expresses permission: ich darf, du darfst, er darf, wir dürfen, ihr dürft, sie dürfen. Nicht dürfen means must not; nicht müssen means do not have to. For polite instructions use verb + Sie: Öffnen Sie das Buch. Informal commands: Komm bitte! / Kommt bitte! After sein, jobs usually have no article: Ich bin Lehrer.',example:['Ich muss heute arbeiten. Hier dürfen Sie nicht rauchen.','I have to work today. You must not smoke here.'],words:[['der Beruf · Berufe','profession'],['der Lehrer · Lehrer','teacher (male)'],['die Lehrerin · Lehrerinnen','teacher (female)'],['das Büro · Büros','office'],['die Schule · Schulen','school'],['die Universität · Universitäten','university'],['die Pause · Pausen','break'],['die Aufgabe · Aufgaben','task'],['öffnen / schließen','to open / close'],['verstehen','to understand']],dialogue:[['Was sind Sie von Beruf?','What is your profession?'],['Ich bin Lehrerin.','I am a teacher.'],['Wann beginnt Ihre Arbeit?','When does your work begin?'],['Um acht Uhr.','At eight o’clock.']],quiz:[['Sie dürfen hier nicht rauchen means…',['You don’t have to smoke here.','You must not smoke here.','You want to smoke here.'],1,'Nicht dürfen expresses prohibition.'],['Polite instruction: ___ Sie bitte das Buch.',['Öffnen','Öffnest','Öffnet'],0,'The formal imperative uses infinitive-form verb + Sie.']],speak:'Say your job or what you study and when your day starts.',write:'Write a short request for help.',sample:'Entschuldigung, ich verstehe die Aufgabe nicht. Können Sie mir bitte helfen?'},
{title:'Health & help',goal:'Describe basic symptoms and make an appointment.',grammar:'Say Ich habe Kopfschmerzen (I have a headache) or Mein Kopf tut weh (my head hurts). A plural subject takes tun: Meine Füße tun weh. Sollen often passes on advice: Der Arzt sagt, ich soll viel trinken. Sollen: soll, sollst, soll, sollen, sollt, sollen. Use a modal plus an infinitive at the end: Ich muss einen Termin machen.',example:['Ich bin krank. Mein Hals tut weh.','I am ill. My throat hurts.'],words:[['der Kopf · Köpfe','head'],['der Hals · Hälse','throat / neck'],['der Bauch · Bäuche','belly'],['der Rücken · Rücken','back'],['die Hand · Hände','hand'],['der Fuß · Füße','foot'],['die Schmerzen (plural)','pain / pains'],['das Fieber (usually singular)','fever'],['der Arzt · Ärzte','doctor (male)'],['die Ärztin · Ärztinnen','doctor (female)']],dialogue:[['Guten Tag. Ich brauche einen Termin.','Hello. I need an appointment.'],['Was fehlt Ihnen?','What is wrong?'],['Ich habe Fieber und Kopfschmerzen.','I have a fever and a headache.'],['Können Sie heute um zehn Uhr kommen?','Can you come today at ten?']],quiz:[['Meine Füße ___ weh.',['tut','tun','tust'],1,'Füße is plural, so use tun.'],['Ich soll viel ___.',['trinke','trinkt','trinken'],2,'Sollen is followed by the infinitive trinken.']],speak:'Role-play making an appointment and naming a symptom.',write:'Write a message saying you cannot come because you are ill.',sample:'Hallo Ben, ich bin krank und habe Fieber. Ich kann heute nicht kommen. Viele Grüße, Alex'},
{title:'Travel & weather',goal:'Book a room and discuss simple travel plans.',grammar:'Use im for seasons: im Sommer, im Winter. Common weather expressions use es: Es regnet. Es ist kalt. For an overnight stay say für zwei Nächte; für takes accusative. Von … bis … gives a range: vom dritten bis zum fünften Mai. Vom = von dem. Questions: Wann? (when), Wie lange? (how long), Wie viel? (how much), Welche? (which).',example:['Ich möchte ein Zimmer für zwei Nächte reservieren.','I would like to reserve a room for two nights.'],words:[['das Hotel · Hotels','hotel'],['das Einzelzimmer · Einzelzimmer','single room'],['das Doppelzimmer · Doppelzimmer','double room'],['die Nacht · Nächte','night'],['das Frühstück (usually singular)','breakfast'],['der Urlaub · Urlaube','holiday'],['der Frühling / der Sommer','spring / summer'],['der Herbst / der Winter','autumn / winter'],['warm / kalt','warm / cold'],['Es regnet. / Die Sonne scheint.','It’s raining. / The sun is shining.']],dialogue:[['Haben Sie ein Zimmer frei?','Do you have a room available?'],['Ja. Für wie viele Nächte?','Yes. For how many nights?'],['Für zwei Nächte. Ist das Frühstück inklusive?','For two nights. Is breakfast included?'],['Ja, das Frühstück ist inklusive.','Yes, breakfast is included.']],quiz:[['___ Sommer ist es oft warm.',['Am','Um','Im'],2,'Seasons take im: im Sommer.'],['Für zwei ___ .',['Nächte','Nacht','Nächten'],0,'Für takes accusative: zwei Nächte.']],speak:'Ask for a room and ask about breakfast and the price.',write:'Write a short room reservation request.',sample:'Guten Tag, ich möchte ein Doppelzimmer für zwei Nächte reservieren. Haben Sie vom 3. bis zum 5. Mai ein Zimmer frei? Was kostet das Zimmer?'},
{title:'Yesterday',goal:'Talk about simple past events.',grammar:'The conversational past (Perfekt) combines haben or sein with a past participle at the end: Ich habe Deutsch gelernt. Regular participles often use ge- + stem + -t: gemacht, gelernt. Common irregular ones: gegessen, getrunken, gelesen, geschrieben, gesehen. Many verbs of movement/change use sein: Ich bin nach Berlin gefahren. Separable: eingekauft, aufgestanden. Verbs in -ieren and verbs with inseparable prefixes such as be- do not add ge-: studiert, besucht. Sein/haben often use war/hatte: Ich war müde. Ich hatte Zeit.',example:['Gestern habe ich gekocht. Danach bin ich ins Kino gegangen.','Yesterday I cooked. After that I went to the cinema.'],words:[['gestern','yesterday'],['letzte Woche','last week'],['gemacht / gelernt','done / learned'],['gegessen / getrunken','eaten / drunk'],['gelesen / geschrieben','read / written'],['gesehen','seen'],['gegangen / gefahren','gone / traveled'],['eingekauft','shopped'],['war / hatte','was / had (I or he/she/it)'],['danach','after that']],dialogue:[['Was hast du gestern gemacht?','What did you do yesterday?'],['Ich habe eingekauft und gekocht.','I shopped and cooked.'],['Bist du zu Hause geblieben?','Did you stay at home?'],['Ja, ich war müde.','Yes, I was tired.']],quiz:[['Ich ___ nach Berlin gefahren.',['habe','bin','hat'],1,'Travel from one place to another with fahren uses sein.'],['Ich habe Deutsch ___.',['gelernt','lernen','lerne'],0,'Perfekt uses a past participle: gelernt.']],speak:'Say three things you did yesterday.',write:'Write a short message about your weekend.',sample:'Am Samstag habe ich eingekauft. Am Sonntag bin ich ins Kino gegangen. Der Film war gut.'},
{title:'Messages & forms',goal:'Write short everyday messages and fill out personal details.',grammar:'Und (and), aber (but), oder (or), and denn (because) connect main clauses without sending the verb to the end: Ich komme nicht, denn ich bin krank. Write informal messages with Hallo/Liebe/Lieber and end with Viele Grüße. Formal messages can start Sehr geehrte Frau … / Sehr geehrter Herr … and end Mit freundlichen Grüßen. After a greeting followed by a comma, the next word is normally lowercase unless it is a noun or Sie.',example:['Hallo Mia, ich komme später, denn mein Zug hat Verspätung.','Hi Mia, I’m coming later because my train is delayed.'],words:[['der Vorname · Vornamen','first name'],['der Nachname · Nachnamen','surname'],['das Geburtsdatum · Geburtsdaten','date of birth'],['die Adresse · Adressen','address'],['die Postleitzahl · Postleitzahlen','postal code'],['die Unterschrift · Unterschriften','signature'],['ledig / verheiratet','single / married'],['die Einladung · Einladungen','invitation'],['die Verspätung · Verspätungen','delay'],['Viele Grüße','best wishes']],dialogue:[['Kommst du zu meiner Party?','Are you coming to my party?'],['Ja, gern. Wann beginnt sie?','Yes, I’d love to. When does it start?'],['Am Samstag um sieben Uhr.','On Saturday at seven.'],['Danke für die Einladung!','Thank you for the invitation!']],quiz:[['Ich komme nicht, denn ich ___ krank.',['bin','sein','bist'],0,'Denn keeps normal main-clause word order: ich bin krank.'],['Nachname means…',['first name','surname','nickname'],1,'Nachname is family name or surname.']],speak:'Ask someone for their name, address, and postal code.',write:'Decline an invitation, give a reason, and suggest another day.',sample:'Hallo Mia, danke für die Einladung. Ich kann am Samstag nicht kommen, denn ich muss arbeiten. Hast du am Sonntag Zeit? Viele Grüße, Alex'}
];
</script><script>const app=document.querySelector('#app');
let current=0, section='learn', view='course', card=0, flipped=false, category=-1, answers={}, completed=new Set();
try{completed=new Set(JSON.parse(localStorage.getItem('anfang-completed')||'[]').filter(n=>Number.isInteger(n)&&n>=0&&n<units.length))}catch{}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const audio=t=>`<button class="audio" data-audio="${esc(t)}" aria-label="Listen to ${esc(t)}">♪</button>`;
function speak(text){const status=document.querySelector('#audio-status');if(!('speechSynthesis' in window)){if(status)status.textContent='Your browser does not support speech. Read the German text aloud instead.';return}const voices=speechSynthesis.getVoices(),voice=voices.find(v=>v.lang.startsWith('de'));speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang='de-DE';utterance.rate=.8;if(voice)utterance.voice=voice;utterance.onerror=()=>{if(status)status.textContent='Audio could not play. Check whether your device has a German voice installed.'};speechSynthesis.speak(utterance);if(status)status.textContent='Device-generated German audio. Voice quality depends on your browser.'}
function intro(){return `<section class="intro"><div><p class="eyebrow">YOUR FIRST CHAPTER IN GERMAN</p><h1>Small steps.<br>A whole new language.</h1><p>Start with “Hallo.” Build the words and confidence for everyday life, one lesson at a time.</p></div><div class="stamp"><div class="row"><span class="eyebrow">THE BEGINNER COURSE</span><strong>A1</strong></div><div class="row"><span>${units.length} guided units</span><span>Learn at your pace</span></div></div></section>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='words')return wordView();if(view==='review')return reviewView();const u=units[current];app.innerHTML=intro()+`<div class="workspace"><aside class="syllabus" aria-label="Course units"><h3>YOUR LEARNING PATH</h3>${units.map((u,i)=>`<button class="unit ${i===current?'selected':''}" data-unit="${i}" aria-current="${i===current?'step':'false'}"><b>${String(i+1).padStart(2,'0')}</b><span>${esc(u.title)}</span>${completed.has(i)?'<small aria-label="completed">✓</small>':''}</button>`).join('')}<div class="progress"><span style="width:${completed.size/units.length*100}%"></span></div><p class="notice">${completed.size} of ${units.length} units complete<br>Progress saved on this device.</p></aside><article class="lesson"><div class="lesson-top"><div><p class="eyebrow">UNIT ${String(current+1).padStart(2,'0')} / ${units.length}</p><h2>${u.title}</h2><p class="subtle">${u.goal}</p></div><span class="pill">A1 · Beginner</span></div><div class="tabs" aria-label="Lesson sections">${['learn','words','listen','practice'].map(t=>`<button data-section="${t}" class="${section===t?'selected':''}" aria-pressed="${section===t}">${{learn:'The essentials',words:'Vocabulary',listen:'Listen & speak',practice:'Practice'}[t]}</button>`).join('')}</div><div id="lesson-body">${lessonBody(u)}</div><div class="row bottom"><span class="subtle">${completed.has(current)?'✓ Marked complete':'Take your time. Say it out loud.'}</span><button class="primary" data-next-section>${section==='practice'?'Complete unit':{learn:'Explore vocabulary',words:'Listen & speak',listen:'Try the practice'}[section]}</button></div><p class="notice" id="audio-status" role="status">Audio uses your device’s German text-to-speech voice.</p></article></div>`}
function lessonBody(u){if(section==='learn')return `<h3>A little grammar, a lot of possibility.</h3><p>${u.grammar}</p><div class="example"><div class="row"><strong lang="de">${u.example[0]}</strong>${audio(u.example[0])}</div><p class="subtle">${u.example[1]}</p></div><h3>Make it yours</h3><p>${u.speak}</p>`;if(section==='words')return `<p class="subtle">Learn nouns together with their article and plural. Tap the note to listen.</p><div class="grid">${u.words.map(w=>`<div class="word"><div><strong lang="de">${w[0]}</strong><small>${w[1]}</small></div>${audio(w[0].split(' · ')[0])}</div>`).join('')}</div>`;if(section==='listen')return `<h3>A conversation you can use</h3><button class="secondary" data-audio="${esc(u.dialogue.map(d=>d[0]).join(' '))}">Listen to the conversation</button>${u.dialogue.map((d,i)=>`<div class="dialogue"><div class="row"><p lang="de"><b>${i%2?'B':'A'}</b> &nbsp;${d[0]}</p>${audio(d[0])}</div><details><summary>Show translation</summary><p>${d[1]}</p></details></div>`).join('')}<h3 style="margin-top:24px">Your turn</h3><p>${u.speak}</p><p class="subtle">Repeat each line, then try without looking. Compare your sounds with the audio.</p>`;return `<h3>Put it into practice</h3>${u.quiz.map((q,i)=>question(q,i)).join('')}<h3>Write a little German</h3><label for="writing">${u.write}</label><textarea id="writing" placeholder="Schreib hier …" lang="de"></textarea><details><summary>Compare with a sample answer</summary><p lang="de">${u.sample}</p><p class="notice">Your wording may differ. Check word order, verb endings, and capital letters on nouns. Writing is for self-review, not automatically graded.</p></details>`}
function question(q,i){let a=answers[`${view}-${current}-${i}`];return `<div class="question"><p><b>${i+1}.</b> ${q[0]}</p><div class="options">${q[1].map((o,j)=>`<button class="option ${a===undefined?'':j===q[2]?'correct':a===j?'incorrect':''}" data-q="${i}" data-answer="${j}" ${a!==undefined?'disabled':''}>${o}</button>`).join('')}</div><div class="feedback" role="status">${a===undefined?'':`${a===q[2]?'Correct.':'Not quite.'} ${q[3]}`}</div></div>`}
function deck(){return (category<0?units: [units[category]]).flatMap(u=>u.words)}
function wordView(){let words=deck();card=Math.min(card,words.length-1);app.innerHTML=`<p class="eyebrow">WORD STUDIO</p><h1>A few words.<br>Every day.</h1><p class="subtle">Recall the meaning before you turn the card over.</p><div class="toolbar"><label for="category">Practice set</label><select id="category"><option value="-1">All ${wordsCount()} entries</option>${units.map((u,i)=>`<option value="${i}" ${category===i?'selected':''}>${i+1}. ${u.title}</option>`).join('')}</select><span>${card+1} / ${words.length}</span></div><button class="flashcard" data-flip aria-label="Flip flashcard"><span class="eyebrow">${flipped?'ENGLISH':'DEUTSCH'}</span><strong lang="${flipped?'en':'de'}">${esc(words[card][flipped?1:0])}</strong><small>Click or press Enter to flip</small></button><div class="row bottom"><button class="secondary" data-card="-1">Previous card</button>${audio(words[card][0].split(' · ')[0])}<button class="primary" data-card="1">Next card</button></div><p class="notice" id="audio-status" role="status">German audio uses your device’s text-to-speech voice.</p>`}
function wordsCount(){return units.reduce((n,u)=>n+u.words.length,0)}
const reviewQuestions=[['Read: “Der Zug fährt um 14:30 Uhr.” When does it leave?',['At 2:30 p.m.','At 4:30 p.m.','At 2:13 p.m.'],0,'14:30 is 2:30 p.m.'],['Read: “Am Sonntag geschlossen.” What does the sign mean?',['Open Sunday','Closed Sunday','Open only on Sunday'],1,'Geschlossen means closed.'],['Choose the correct question.',['Wo du wohnst?','Wo wohnst du?','Wo wohnen du?'],1,'Question word + conjugated verb + subject.'],['Ich sehe ___ Mann.',['der','dem','den'],2,'A masculine direct object uses den.'],['Wir ___ gestern in Berlin.',['war','waren','wart'],1,'The past of sein with wir is waren.'],['Ich kann heute nicht kommen, denn …',['ich bin krank.','bin ich krank.','ich krank bin.'],0,'Denn preserves main-clause word order.'],['Ich habe gestern Brot ___.',['kaufe','gekauft','kaufen'],1,'Perfekt: habe + gekauft.'],['Listen to the announcement above. Where is the meeting?',['At the station','At the café','At school'],1,'Im Café means at the café.']];
function reviewView(){let answered=reviewQuestions.filter((_,i)=>answers[`review-${current}-${i}`]!==undefined).length,score=reviewQuestions.filter((q,i)=>answers[`review-${current}-${i}`]===q[2]).length;app.innerHTML=`<p class="eyebrow">BRING IT ALL TOGETHER</p><h1>Your A1 checkpoint.</h1><p class="subtle">Practice reading, listening, writing, and speaking. This is an independent review, not an official exam or a proficiency certificate.</p><div class="grid"><section class="review-card"><h2>Read & listen</h2><button class="secondary" data-audio="Wir treffen uns am Freitag um drei Uhr im Café.">Play listening announcement</button><details><summary>Show listening transcript</summary><p lang="de">Wir treffen uns am Freitag um drei Uhr im Café.</p></details>${reviewQuestions.map((q,i)=>question(q,i)).join('')}<div role="status"><b>${answered===reviewQuestions.length?`Your result: ${score} / ${reviewQuestions.length}`:`${answered} / ${reviewQuestions.length} answered`}</b></div><button class="secondary" data-retry style="margin-top:18px">Try again</button><p class="notice" id="audio-status" role="status"></p></section><section><div class="review-card"><h2>Write</h2><label for="review-writing">Invite a friend to your birthday. Say when and where, and ask them to bring something. Aim for 30–40 words.</label><textarea id="review-writing" lang="de" placeholder="Hallo …"></textarea><details><summary>Sample response & checklist</summary><p lang="de">Hallo Mia, am Samstag habe ich Geburtstag. Ich mache um sechs Uhr eine Party bei mir zu Hause. Kannst du kommen? Bring bitte einen Kuchen mit. Ich freue mich auf dich! Viele Grüße, Alex</p><p>Did you include a greeting, a day/time, a place, a request, and a closing? Check verbs and noun capitalization.</p></details></div><div class="review-card" style="margin-top:20px"><h2>Speak</h2><p>Introduce yourself for about one minute: name, country, city, languages, work or study, and hobbies.</p><p>Then ask a partner for their phone number, offer them a drink, and arrange a meeting.</p><details><summary>Helpful sentence starters</summary><p lang="de">Ich heiße … / Ich komme aus … / Ich wohne in … / Ich spreche … / Ich arbeite als … / Ich … gern. / Wie ist deine Telefonnummer? / Möchtest du einen Tee? / Wann hast du Zeit?</p></details></div><div class="review-card" style="margin-top:20px"><h2>Ready for everyday life?</h2><p>Use these as self-checks after the course.</p>${['I can introduce myself and ask personal questions.','I can understand slow, simple speech on familiar topics.','I can order food, shop, and ask for directions.','I can read simple signs and short messages.','I can complete personal details on a form.','I can write a short invitation or practical message.'].map(t=>`<label><input type="checkbox"> ${t}</label>`).join('')}</div></section></div>`}
function openUnit(index){if(!Number.isInteger(index)||index<0||index>=units.length)throw new Error('Unit must be an integer from 1 to 17.');current=index;view='course';section='learn';render()}
document.addEventListener('click',e=>{let b=e.target.closest('button,a.brand');if(!b)return;if(b.matches('a.brand')){e.preventDefault();view='course';render()}if(b.dataset.view){view=b.dataset.view;render()}if(b.dataset.unit!==undefined)openUnit(Number(b.dataset.unit));if(b.dataset.section){section=b.dataset.section;render()}if(b.dataset.audio)speak(b.dataset.audio);if(b.hasAttribute('data-flip')){flipped=!flipped;wordView()}if(b.dataset.card){card=(card+Number(b.dataset.card)+deck().length)%deck().length;flipped=false;wordView()}if(b.hasAttribute('data-next-section')){if(section==='practice'){completed.add(current);try{localStorage.setItem('anfang-completed',JSON.stringify([...completed]))}catch{}if(current<units.length-1){current++;section='learn'}else view='review'}else section=['learn','words','listen','practice'][['learn','words','listen','practice'].indexOf(section)+1];render()}if(b.dataset.q!==undefined){const i=Number(b.dataset.q),a=Number(b.dataset.answer),q=view==='review'?reviewQuestions[i]:units[current].quiz[i];answers[`${view}-${current}-${i}`]=a;const el=b.closest('.question');el.querySelectorAll('.option').forEach((o,j)=>{o.disabled=true;o.classList.toggle('correct',j===q[2]);o.classList.toggle('incorrect',j===a&&a!==q[2])});el.querySelector('.feedback').textContent=(a===q[2]?'Correct. ':'Not quite. ')+q[3];if(view==='review'){let answered=reviewQuestions.filter((_,n)=>answers[`review-${current}-${n}`]!==undefined).length,score=reviewQuestions.filter((q,n)=>answers[`review-${current}-${n}`]===q[2]).length;document.querySelector('.review-card > div[role="status"]').textContent=answered===reviewQuestions.length?`Your result: ${score} / ${reviewQuestions.length}`:`${answered} / ${reviewQuestions.length} answered`}}if(b.hasAttribute('data-retry')){Object.keys(answers).filter(k=>k.startsWith('review-')).forEach(k=>delete answers[k]);reviewView()}});
document.addEventListener('change',e=>{if(e.target.id==='category'){category=Number(e.target.value);card=0;flipped=false;wordView()}});
render();
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'open_german_unit',description:'Open an A1 German unit, numbered 1 to 17. Does not mark it complete.',inputSchema:{type:'object',properties:{unit:{type:'integer',minimum:1,maximum:17}},required:['unit'],additionalProperties:false},annotations:{readOnlyHint:false},execute:input=>{openUnit(input.unit-1);return{unit:current+1,title:units[current].title}}})).catch(()=>{})}catch{}}
</script></body></html>
